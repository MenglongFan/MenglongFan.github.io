<!-- 设计系统：彩格调 (CaiGeDiao) 令牌 v1 · 吕祖灵签原型 · 单文件 / 无外部依赖 / 资源全内联 -->
<!-- v3 增强版：摇一摇抽签 · 无按钮交互 · 山水画卷背景 · 飘落花瓣 · 浮动道符 · 水墨云气 -->
<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吕祖灵签</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%239E2B25'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='serif'>吕</text></svg>">
<style>
  /* ============ 设计令牌（严格遵守 彩格调） ============ */
  :root{
    --bg:#FAFAF8;          /* 背景 宣纸 */
    --ink:#2B2B2B;         /* 主文 墨灰 */
    --ink-light:#6E6E6E;   /* 次级 浅墨（正文级，≈4.87:1 达 WCAG AA） */
    --line:#D8D5CE;        /* 1px 分隔线 */
    --seal:#9E2B25;        /* 朱印红（仅用于印章/签印/点缀） */
    --gold:#B8860B;        /* 暗金（装饰点缀） */
    --font-title:"Kaiti SC","STKaiti","KaiTi",serif;   /* 楷体栈 */
    --font-body:"Songti SC","STSong","SimSun",serif;   /* 宋体栈 */
    --maxw:760px;          /* 内容最大宽度 */
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  body{min-height:100vh;position:relative;}

  /* ============ Canvas 水墨背景层 ============ */
  #ink-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}

  /* ============ SVG 山水装饰层 ============ */
  .scenery{
    position:fixed;bottom:0;left:0;width:100%;height:45vh;
    z-index:0;pointer-events:none;opacity:0.5;
  }
  .scenery svg{width:100%;height:100%;display:block;}

  /* ============ 顶部云纹装饰 ============ */
  .cloud-deco{
    position:fixed;top:0;left:0;width:100%;height:200px;
    z-index:0;pointer-events:none;opacity:0.25;
  }
  .cloud-deco svg{width:100%;height:100%;display:block;}

  /* ============ 背景水印 ============ */
  .watermark{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    font-family:var(--font-title);font-size:clamp(120px,30vw,320px);
    color:rgba(43,43,43,0.028);letter-spacing:0.3em;white-space:nowrap;
    z-index:0;pointer-events:none;user-select:none;line-height:1;
  }

  /* ============ 屏幕阅读器专用（视觉隐藏） ============ */
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}

  /* ============ 状态机 ============ */
  .state{display:none;}
  .state.is-active{
    display:flex;flex-direction:column;align-items:center;justify-content:safe center;
    min-height:100vh;padding:48px 16px;position:relative;z-index:1;
    animation:enter .6s ease-out both;
  }
  @keyframes enter{
    from{opacity:0;transform:translateY(12px);}
    to{opacity:1;transform:none;}
  }
  .inner{width:100%;max-width:var(--maxw);margin:0 auto;}

  /* ============ 视差层 ============ */
  .parallax{transition:transform .4s cubic-bezier(0.2,0,0.2,1);will-change:transform;}

  /* ============ 态A 首页 ============ */
  .home-inner{display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;user-select:none;}

  /* 逐元素入场动画 */
  .reveal{opacity:0;animation:revealUp .8s cubic-bezier(0.2,0,0.2,1) forwards;}
  @keyframes revealUp{
    from{opacity:0;transform:translateY(16px);}
    to{opacity:1;transform:none;}
  }
  .reveal-1{animation-delay:.15s;}
  .reveal-2{animation-delay:.35s;}
  .reveal-3{animation-delay:.55s;}
  .reveal-4{animation-delay:.75s;}
  .reveal-5{animation-delay:.95s;}

  .wordmark{
    font-family:var(--font-title);font-size:28px;line-height:1.8;letter-spacing:0.08em;
    color:var(--ink);font-weight:400;margin-bottom:24px;
  }
  .guide{
    font-family:var(--font-body);font-size:16px;line-height:1.9;letter-spacing:0.04em;
    color:var(--ink-light);margin-bottom:56px;
  }
  .tube-wrap{position:relative;margin-bottom:40px;}

  /* 签筒光晕 */
  .tube-aura{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:280px;height:280px;border-radius:50%;
    background:radial-gradient(circle, rgba(158,43,37,0.04) 0%, rgba(184,134,11,0.03) 40%, transparent 70%);
    animation:auraPulse 4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes auraPulse{
    0%,100%{transform:translate(-50%,-50%) scale(0.9);opacity:0.6;}
    50%{transform:translate(-50%,-50%) scale(1.1);opacity:1;}
  }

  .tube-svg{display:block;width:160px;height:240px;position:relative;z-index:1;}

  /* 签筒微浮动 */
  .tube-float{animation:gentleFloat 6s ease-in-out infinite;}
  @keyframes gentleFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-6px);}
  }

  /* 摇一摇提示 */
  .shake-hint-large{
    font-family:var(--font-title);font-size:20px;letter-spacing:0.15em;
    color:var(--ink);margin-bottom:8px;position:relative;
  }
  .shake-hint-sub{
    font-family:var(--font-body);font-size:14px;letter-spacing:0.06em;
    color:var(--ink-light);
  }

  /* 摇一摇图标动画 */
  .shake-icon{
    display:inline-block;width:20px;height:20px;margin:0 6px;
    vertical-align:middle;
    animation:shakeIcon 2s ease-in-out infinite;
  }
  @keyframes shakeIcon{
    0%,100%{transform:rotate(0deg);}
    10%{transform:rotate(-12deg);}
    20%{transform:rotate(12deg);}
    30%{transform:rotate(-8deg);}
    40%{transform:rotate(8deg);}
    50%{transform:rotate(0deg);}
  }

  /* 点击涟漪（全屏） */
  .tap-ripple{
    position:fixed;border-radius:50%;background:rgba(158,43,37,0.06);
    transform:scale(0);pointer-events:none;z-index:999;
    animation:tapRipple .8s ease-out forwards;
  }
  @keyframes tapRipple{
    to{transform:scale(30);opacity:0;}
  }

  /* ============ 态B 摇签动画 ============ */
  .shake-inner{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;}
  .shake-hint{
    font-family:var(--font-title);font-size:16px;letter-spacing:0.12em;
    color:var(--ink-light);margin-bottom:48px;
  }
  .tube{transform-box:fill-box;transform-origin:50% 96%;}
  .tube.shaking{animation:shake 1.2s cubic-bezier(0.4,0,0.2,1);}
  @keyframes shake{
    0%{transform:rotate(0deg);}
    12%{transform:rotate(8deg);}
    28%{transform:rotate(-8deg);}
    44%{transform:rotate(8deg);}
    60%{transform:rotate(-8deg);}
    76%{transform:rotate(8deg);}
    88%{transform:rotate(-8deg);}
    100%{transform:rotate(0deg);}
  }
  .falling-stick{
    position:absolute;left:50%;top:40%;width:40px;height:120px;
    transform:translateX(-50%);opacity:0;pointer-events:none;
  }
  .falling-stick.drop{animation:fall .72s ease-in forwards;}
  @keyframes fall{
    0%{opacity:0;transform:translateX(-50%) translateY(-40px);}
    20%{opacity:1;}
    100%{opacity:0;transform:translateX(-50%) translateY(40px);}
  }

  /* ============ 态C 解签卡 ============ */
  .result-inner{display:flex;flex-direction:column;align-items:center;text-align:center;}
  .brand-mini{
    font-family:var(--font-body);font-size:13px;letter-spacing:0.16em;
    color:var(--ink-light);margin-bottom:32px;
  }
  .sign-head{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:8px;}

  .seal{
    width:48px;height:48px;background:var(--seal);color:#fff;
    font-family:var(--font-title);font-size:13px;line-height:1;letter-spacing:1px;
    display:flex;align-items:center;justify-content:center;
    writing-mode:vertical-rl;white-space:nowrap;border-radius:0;
    box-shadow:inset 0 0 0 1px rgba(250,250,248,0.5);
    animation:sealGlow 3s ease-in-out infinite;
  }
  @keyframes sealGlow{
    0%,100%{box-shadow:inset 0 0 0 1px rgba(250,250,248,0.5),0 0 0 0 rgba(158,43,37,0);}
    50%{box-shadow:inset 0 0 0 1px rgba(250,250,248,0.5),0 0 16px 2px rgba(158,43,37,0.12);}
  }
  .sign-level{font-family:var(--font-title);font-size:20px;letter-spacing:0.1em;color:var(--ink);}
  .sign-title{font-family:var(--font-title);font-size:28px;line-height:1.8;letter-spacing:0.08em;color:var(--ink);}

  .poem-block{
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:32px 0;margin:40px 0;width:100%;
  }
  .poem{font-family:var(--font-body);font-size:20px;line-height:2.0;text-align:center;color:var(--ink);letter-spacing:0.04em;}
  .poem span{display:block;}

  /* 书法揭显效果已移除（用户反馈不佳） */

  .field{width:100%;text-align:left;margin:32px 0;}
  .field-center{text-align:center;}
  .field-label{font-family:var(--font-title);font-size:16px;letter-spacing:0.08em;color:var(--ink);margin-bottom:12px;}
  .field-text{font-family:var(--font-body);font-size:16px;line-height:1.9;color:var(--ink);}
  .hexagram-row{display:flex;align-items:baseline;gap:12px;}
  .hexagram-row .field-label{margin-bottom:0;}
  .hexagram-row .field-text{font-size:13px;color:var(--ink-light);}

  .advice{list-style:none;text-align:left;}
  .advice li{font-family:var(--font-body);font-size:15px;line-height:1.9;color:var(--ink-light);margin:8px 0;}
  .advice .cat{font-family:var(--font-title);color:var(--ink);margin-right:8px;}
  .advice .dot{color:var(--ink-light);margin-right:8px;}

  .actions{margin-top:48px;display:flex;gap:40px;justify-content:center;}
  .ghost{
    background:none;border:none;font-family:var(--font-title);font-size:16px;letter-spacing:0.06em;
    color:var(--ink-light);border-bottom:1px solid var(--line);padding:4px 2px;cursor:pointer;
    transition:color .35s ease,border-color .35s ease,transform .35s ease;
  }
  .ghost:hover{color:var(--seal);border-color:var(--seal);transform:translateY(-1px);}

  /* ============ 诚实声明（角落注释） ============ */
  .disclaimer{
    position:fixed;right:16px;bottom:12px;
    font-family:var(--font-body);font-size:13px;letter-spacing:0.02em;color:var(--ink-light);
    z-index:2;
  }

  /* ============ 响应式 ≤640px ============ */
  @media (max-width:640px){
    .tube-svg{width:128px;height:192px;}
    .tube-aura{width:220px;height:220px;}
    .wordmark{font-size:24px;}
    .guide{font-size:14px;margin-bottom:40px;}
    .sign-title{font-size:24px;}
    .poem{font-size:18px;}
    .field-text,.advice li{font-size:14px;}
    .sign-level{font-size:18px;}
    .actions{gap:28px;flex-wrap:wrap;}
    .disclaimer{font-size:12px;right:10px;bottom:8px;}
    .watermark{font-size:clamp(80px,40vw,200px);}
    .shake-hint-large{font-size:18px;}
  }

  /* ============ 前庭敏感用户降级：关闭所有位移动画 ============ */
  @media (prefers-reduced-motion: reduce){
    .state.is-active{animation:none;}
    .tube.shaking{animation:none;}
    .falling-stick.drop{animation:none;}
    .tube-float{animation:none;}
    .seal{animation:none;}
    .reveal{opacity:1;animation:none;}
    .poem span.caligraphy-reveal{overflow:visible;animation:none;max-width:100%;}
    .tap-ripple{display:none;}
    .tube-aura{animation:none;}
    .shake-icon{animation:none;}
    .poem span.caligraphy-reveal{overflow:visible;animation:none;max-width:100%;}
  }
</style>
</head>
<body>

  <!-- ============ Canvas 水墨背景 ============ -->
  <canvas id="ink-canvas"></canvas>

  <!-- ============ 顶部云纹装饰 ============ -->
  <div class="cloud-deco" aria-hidden="true">
    <svg viewBox="0 0 1200 200" preserveAspectRatio="xMidYMid slice">
      <!-- 左上云纹 -->
      <path d="M0,80 Q40,60 80,70 Q120,50 160,65 Q200,45 240,60 Q280,50 320,65"
            stroke="#8A8A8A" stroke-width="1.5" fill="none" opacity="0.4"/>
      <path d="M20,100 Q60,85 100,95 Q140,78 180,90 Q220,75 260,88 Q300,80 340,92"
            stroke="#8A8A8A" stroke-width="1" fill="none" opacity="0.3"/>
      <!-- 右上云纹 -->
      <path d="M880,70 Q920,50 960,65 Q1000,45 1040,60 Q1080,50 1120,65 Q1160,55 1200,70"
            stroke="#8A8A8A" stroke-width="1.5" fill="none" opacity="0.4"/>
      <path d="M860,95 Q900,80 940,90 Q980,75 1020,88 Q1060,80 1100,92 Q1140,85 1180,95"
            stroke="#8A8A8A" stroke-width="1" fill="none" opacity="0.3"/>
      <!-- 中央祥云 -->
      <g opacity="0.15" fill="none" stroke="#9E2B25" stroke-width="1">
        <path d="M540,40 Q560,25 580,35 Q600,20 620,32 Q640,25 660,38"/>
        <path d="M550,55 Q575,42 600,50 Q625,40 650,52"/>
      </g>
    </svg>
  </div>

  <!-- ============ 底部山水画卷 ============ -->
  <div class="scenery" aria-hidden="true">
    <svg viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice">
      <!-- 远山（最淡） -->
      <path d="M0,280 Q100,200 200,240 Q300,180 400,220 Q500,160 600,210 Q700,170 800,215 Q900,165 1000,210 Q1100,180 1200,225 L1200,400 L0,400 Z"
            fill="rgba(43,43,43,0.04)"/>
      <!-- 中山 -->
      <path d="M0,320 Q80,260 180,290 Q280,240 380,275 Q480,230 580,270 Q680,235 780,275 Q880,240 980,280 Q1080,250 1200,290 L1200,400 L0,400 Z"
            fill="rgba(43,43,43,0.06)"/>
      <!-- 近山 -->
      <path d="M0,360 Q60,320 140,345 Q220,310 300,335 Q400,305 500,330 Q600,300 700,325 Q800,300 900,330 Q1000,305 1100,330 Q1160,315 1200,340 L1200,400 L0,400 Z"
            fill="rgba(43,43,43,0.08)"/>
      <!-- 远处小亭 -->
      <g opacity="0.06" stroke="#2B2B2B" stroke-width="1" fill="none">
        <!-- 亭子 -->
        <path d="M380,310 L380,335 M420,310 L420,335 M375,310 L425,310 M370,305 L430,305 L425,310 L375,310 Z M380,305 L400,285 L420,305"/>
      </g>
      <!-- 松树剪影 -->
      <g opacity="0.07" fill="rgba(43,43,43,0.5)">
        <path d="M120,340 Q115,320 118,300 Q112,315 110,335 Z M118,300 Q125,290 130,295 Q128,285 122,282 Q126,278 120,275 Q115,280 118,282 Q112,285 115,295 Q108,290 110,300 Z"/>
        <path d="M1050,345 Q1045,325 1048,305 Q1042,320 1040,340 Z M1048,305 Q1055,295 1060,300 Q1058,290 1052,287 Q1056,283 1050,280 Q1045,285 1048,287 Q1042,290 1045,300 Q1038,295 1040,305 Z"/>
      </g>
    </svg>
  </div>

  <!-- ============ 背景水印 ============ -->
  <div class="watermark" aria-hidden="true">呂祖靈籤</div>

  <!-- ============ 态A 首页（摇签入口） ============ -->
  <section id="state-home" class="state is-active" aria-label="首页">
    <div class="inner home-inner" id="home-tap-area">
      <h1 class="wordmark reveal reveal-1 parallax" data-depth="0.3">吕祖灵签</h1>
      <p class="guide reveal reveal-2">心诚则灵，默念所问，再求一签</p>
      <div class="tube-wrap reveal reveal-3 parallax" data-depth="0.6">
        <div class="tube-aura"></div>
        <div class="tube-float">
        <svg class="tube-svg" viewBox="0 0 200 300" role="img" aria-label="签筒">
          <g class="tube">
            <g stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" fill="none">
              <line x1="86" y1="120" x2="74" y2="46"/>
              <line x1="93" y1="120" x2="88" y2="30"/>
              <line x1="100" y1="120" x2="100" y2="20"/>
              <line x1="107" y1="120" x2="112" y2="30"/>
              <line x1="114" y1="120" x2="126" y2="46"/>
              <line x1="80" y1="120" x2="68" y2="62"/>
              <line x1="120" y1="120" x2="132" y2="62"/>
            </g>
            <g fill="#8A8A8A">
              <circle cx="74" cy="46" r="2.4"/><circle cx="88" cy="30" r="2.4"/>
              <circle cx="100" cy="20" r="2.4"/><circle cx="112" cy="30" r="2.4"/>
              <circle cx="126" cy="46" r="2.4"/><circle cx="68" cy="62" r="2.4"/>
              <circle cx="132" cy="62" r="2.4"/>
            </g>
            <g stroke="#2B2B2B" stroke-width="2" fill="none" stroke-linejoin="round">
              <path d="M54 120 C 56 175 58 225 62 252"/>
              <path d="M146 120 C 144 175 142 225 138 252"/>
              <path d="M62 252 Q 100 270 138 252"/>
              <ellipse cx="100" cy="120" rx="46" ry="12"/>
            </g>
            <path d="M58 121 Q 100 133 142 121" stroke="#8A8A8A" stroke-width="1" fill="none"/>
          </g>
        </svg>
        </div>
      </div>
      <div class="reveal reveal-4">
        <p class="shake-hint-large">
          <svg class="shake-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2l3 6 3-6M15 2l3 6 3-6M3 10h18M5 10v6a7 7 0 0014 0v-6"/>
          </svg>
          摇一摇抽签
        </p>
        <p class="shake-hint-sub">摇动手机 · 或轻触屏幕</p>
      </div>
    </div>
  </section>

  <!-- ============ 态B 摇签动画（签筒晃动→落签） ============ -->
  <section id="state-shake" class="state" aria-label="摇签">
    <div class="inner shake-inner">
      <p class="shake-hint">虔心一摇，签将至</p>
      <div class="tube-wrap">
        <svg class="tube-svg" viewBox="0 0 200 300" role="img" aria-label="签筒">
          <g class="tube">
            <g stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" fill="none">
              <line x1="86" y1="120" x2="74" y2="46"/>
              <line x1="93" y1="120" x2="88" y2="30"/>
              <line x1="100" y1="120" x2="100" y2="20"/>
              <line x1="107" y1="120" x2="112" y2="30"/>
              <line x1="114" y1="120" x2="126" y2="46"/>
              <line x1="80" y1="120" x2="68" y2="62"/>
              <line x1="120" y1="120" x2="132" y2="62"/>
            </g>
            <g fill="#8A8A8A">
              <circle cx="74" cy="46" r="2.4"/><circle cx="88" cy="30" r="2.4"/>
              <circle cx="100" cy="20" r="2.4"/><circle cx="112" cy="30" r="2.4"/>
              <circle cx="126" cy="46" r="2.4"/><circle cx="68" cy="62" r="2.4"/>
              <circle cx="132" cy="62" r="2.4"/>
            </g>
            <g stroke="#2B2B2B" stroke-width="2" fill="none" stroke-linejoin="round">
              <path d="M54 120 C 56 175 58 225 62 252"/>
              <path d="M146 120 C 144 175 142 225 138 252"/>
              <path d="M62 252 Q 100 270 138 252"/>
              <ellipse cx="100" cy="120" rx="46" ry="12"/>
            </g>
            <path d="M58 121 Q 100 133 142 121" stroke="#8A8A8A" stroke-width="1" fill="none"/>
          </g>
        </svg>
        <svg class="falling-stick" viewBox="0 0 40 120" aria-hidden="true">
          <line x1="20" y1="8" x2="20" y2="100" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/>
          <circle cx="20" cy="8" r="2.6" fill="#2B2B2B"/>
          <text x="20" y="116" text-anchor="middle" font-family="Kaiti SC,STKaiti,KaiTi,serif" font-size="12" fill="#6E6E6E">签</text>
        </svg>
      </div>
    </div>
  </section>

  <!-- ============ 态C 解签卡（单屏） ============ -->
  <section id="state-result" class="state" aria-label="解签">
    <div class="inner result-inner">
      <p class="brand-mini">吕祖灵签 · 解签</p>
      <header class="sign-head">
        <div class="seal" id="r-seal">第一签</div>
        <p class="sign-level" id="r-level">上上</p>
        <p class="sign-title" id="r-title">「钟离十试」</p>
      </header>

      <div class="poem-block">
        <p class="poem" id="r-poem"></p>
      </div>

      <div class="field">
        <p class="field-label">解曰</p>
        <p class="field-text" id="r-explain"></p>
      </div>

      <div class="field">
        <div class="hexagram-row">
          <span class="field-label">卦象</span>
          <span class="field-text" id="r-hexagram"></span>
        </div>
      </div>

      <div class="field">
        <p class="field-label">决疑指引</p>
        <ul class="advice" id="r-advice"></ul>
      </div>

      <nav class="actions">
        <button class="ghost" id="btn-again">再求一签</button>
        <button class="ghost" id="btn-share">分享此签</button>
      </nav>
      <span class="sr-only" aria-live="polite" id="share-status"></span>
    </div>
  </section>

  <p class="disclaimer">签文据传统吕祖灵签百签整理（来源：算卜网、明师苑等），仅供文化参考与娱乐</p>

<script src="data/luzu-signs.js"></script>
<script>
  /* ============ 签文数据：优先读取仓库 data/luzu-signs.js 的完整百签文库 ============ */
  const SIGNS = [
    {
      id:"第一签", level:"上上", title:"钟离十试",
      poem:["白云深处遇仙真，","一语点醒梦中人。","宝剑出匣光自满，","功名何用更劳神。"],
      explain:"此签主谋望皆遂，困滞得伸。守正待时，自有贵人暗扶。凡事勿躁进，静则得所。",
      hexagram:"乾为天（刚健中正，元亨利贞）",
      advice:{
        "婚姻":"良缘天定，宜迟不宜急。",
        "求财":"财源渐丰，勿贪多务得。",
        "事业":"前程似锦，守拙养明。",
        "出行":"坦途可往，逢贵得助。",
        "疾病":"心神不安，静养自痊。"
      }
    },
    {
      id:"第二签", level:"中平", title:"纯阳画鹤",
      poem:["闲来挥笔写云烟，","墨落忽成飞上天。","莫道浮生如梦幻，","清名留与后人传。"],
      explain:"此签谋事反复，先难后易。守分安命，不宜躁进。功名似有还无，得失随缘。",
      hexagram:"巽为风（随风巽顺，谦逊得利）",
      advice:{
        "婚姻":"迟则成，急则变。",
        "求财":"小有进益，莫求厚利。",
        "事业":"渐入佳境，守静为宜。",
        "出行":"平顺，宜择吉而行。",
        "疾病":"调养可愈，忌劳神。"
      }
    },
    {
      id:"第三签", level:"下下", title:"迷途问津",
      poem:["雾锁重山路渺茫，","孤舟夜半怯风浪。","分明指处犹难辨，","莫把歧途作故乡。"],
      explain:"此签事多阻碍，谋望难成。防小人暗算，宜退守不宜进。守拙藏锋，可免其咎。",
      hexagram:"坎为水（重重险陷，惟心亨通）",
      advice:{
        "婚姻":"多生波折，宜缓议。",
        "求财":"耗散之兆，守财为上。",
        "事业":"困顿不前，宜守不宜动。",
        "出行":"阻碍多，暂宜中止。",
        "疾病":"沉绵难起，宜早医。"
      }
    },
    {
      id:"第四签", level:"中平", title:"黄粱一梦",
      poem:["邯郸道上遇真人，","一枕清风吹梦尘。","富贵功名皆幻影，","不如归去卧松云。"],
      explain:"此签浮华易散，知足常乐。看破放下，反得安稳。名利如幻，莫为所迷。",
      hexagram:"坤为地（厚德载物，安顺守成）",
      advice:{
        "婚姻":"平淡是福，莫生比较。",
        "求财":"财如流水，来去由天。",
        "事业":"安稳为上，勿好高骛远。",
        "出行":"可往可还，随缘自在。",
        "疾病":"心宽则愈，勿多忧疑。"
      }
    },
    {
      id:"第五签", level:"上上", title:"点石成金",
      poem:["金丹一粒点凡胎，","困顿今朝豁然开。","莫道从前多蹉跌，","春风一夜满庭槐。"],
      explain:"此签否极泰来，困者得舒。转机将至，把握时机。从前蹉跌，今朝尽雪。",
      hexagram:"雷火丰（光明盛大，宜进取）",
      advice:{
        "婚姻":"佳偶天成，喜事临门。",
        "求财":"时来运转，求必有益。",
        "事业":"青云有路，奋发可期。",
        "出行":"顺遂无阻，利于远行。",
        "疾病":"沉疴得解，渐入康泰。"
      }
    }
  ];

  /* ============ 状态切换 ============ */
  const home = document.getElementById('state-home');
  const shake = document.getElementById('state-shake');
  const result = document.getElementById('state-result');
  let busy = false;

  function showState(el){
    [home,shake,result].forEach(s=>{ s.classList.remove('is-active'); });
    el.classList.add('is-active');
    el.querySelectorAll('.reveal').forEach(r=>{
      r.style.animation='none';
      void r.offsetWidth;
      r.style.animation='';
    });
  }

  const REAL_SIGNS = (window.LUZU_SIGNS || []).map(s => ({
    id: '第' + s.id + '签',
    level: s.grade,
    title: s.title,
    poem: (s.poem || '').split('\n').filter(Boolean),
    explain: s.meaning || '',
    hexagram: '',
    advice: Object.fromEntries(Object.entries(s.luck || {}).filter(([k,v]) => v && String(v).trim()))
  }));
  const SIGNS_ALL = REAL_SIGNS.length ? REAL_SIGNS : SIGNS;
  document.querySelector('.disclaimer').textContent = REAL_SIGNS.length
    ? '签文据传统吕祖灵签百签整理（来源：算卜网、明师苑等），仅供文化参考与娱乐'
    : '示意签文 · 正式上线请接入完整吕祖灵签百签文库';
  function pickSign(){ return SIGNS_ALL[Math.floor(Math.random()*SIGNS_ALL.length)]; }

  function renderResult(s){
    document.getElementById('r-seal').textContent = s.id;
    document.getElementById('r-level').textContent = s.level;
    document.getElementById('r-title').textContent = '「'+s.title+'」';
    const poemEl = document.getElementById('r-poem');
    poemEl.innerHTML = s.poem.map(l=>'<span>'+l+'</span>').join('');
    document.getElementById('r-explain').textContent = s.explain;
    const hexField = document.getElementById('r-hexagram');
    const hexWrap = hexField.closest('.field');
    if(s.hexagram && s.hexagram.trim()){ hexField.textContent = s.hexagram; hexWrap.style.display = ''; }
    else { hexWrap.style.display = 'none'; }
    document.getElementById('r-advice').innerHTML = Object.entries(s.advice).map(([k,v])=>
      '<li><span class="cat">'+k+'</span><span class="dot">·</span><span class="txt">'+v+'</span></li>'
    ).join('');
  }

  function startShake(){
    if(busy) return;
    busy = true;
    const tube = shake.querySelector('.tube');
    const stick = shake.querySelector('.falling-stick');

    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduceMotion){
      renderResult(pickSign());
      showState(result);
      busy = false;
      return;
    }

    showState(shake);
    setTimeout(()=>{
      tube.classList.remove('shaking');
      void tube.getBoundingClientRect();
      tube.classList.add('shaking');
    }, 480);

    tube.addEventListener('animationend', function onEnd(e){
      if(e.animationName !== 'shake') return;
      tube.removeEventListener('animationend', onEnd);
      stick.classList.add('drop');
      setTimeout(()=>{
        renderResult(pickSign());
        showState(result);
        busy = false;
      }, 720);
    });
  }

  /* ============ 点击涟漪（全屏） ============ */
  function createTapRipple(x, y){
    const r = document.createElement('div');
    r.className = 'tap-ripple';
    const size = 20;
    r.style.width = r.style.height = size + 'px';
    r.style.left = (x - size/2) + 'px';
    r.style.top = (y - size/2) + 'px';
    document.body.appendChild(r);
    setTimeout(()=>r.remove(), 800);
  }

  /* ============ 交互绑定 ============ */
  // 首页：轻触/点击屏幕即可摇签（无按钮）
  document.getElementById('home-tap-area').addEventListener('click', (e)=>{
    createTapRipple(e.clientX, e.clientY);
    startShake();
  });

  document.getElementById('btn-again').addEventListener('click', ()=>{
    shake.querySelector('.tube').classList.remove('shaking');
    shake.querySelector('.falling-stick').classList.remove('drop');
    showState(home);
  });

  document.getElementById('btn-share').addEventListener('click', ()=>{
    const b = document.getElementById('btn-share');
    const seal = document.getElementById('r-seal').textContent;
    const lvl  = document.getElementById('r-level').textContent;
    const ttl  = document.getElementById('r-title').textContent;
    const text = '【吕祖灵签】'+seal+' '+lvl+' '+ttl;
    try{ if(navigator.clipboard) navigator.clipboard.writeText(text); }catch(e){}
    const old = b.textContent; b.textContent = '已复制签文';
    const status = document.getElementById('share-status');
    if(status) status.textContent = '已复制签文，可粘贴分享';
    setTimeout(()=>{ b.textContent = old; if(status) status.textContent = ''; }, 1600);
  });

  /* ============ 摇一摇（设备动作，页面加载即启用） ============ */
  let motionReady = false;
  function enableMotion(){
    if(motionReady) return;
    const D = window.DeviceMotionEvent;
    if(D && typeof D.requestPermission === 'function'){
      // iOS 13+ 需要用户交互后才能请求权限
      D.requestPermission().then(p=>{
        if(p==='granted'){ window.addEventListener('devicemotion', onMotion); motionReady = true; }
      }).catch(()=>{});
    } else if(D){
      window.addEventListener('devicemotion', onMotion); motionReady = true;
    }
  }

  // 非 iOS（不需要权限请求的）直接启用
  if(window.DeviceMotionEvent && typeof window.DeviceMotionEvent.requestPermission !== 'function'){
    window.addEventListener('devicemotion', onMotion);
    motionReady = true;
  }

  // iOS 需要首次点击时请求权限
  document.addEventListener('click', function once(){
    enableMotion();
    document.removeEventListener('click', once);
  }, { once: true });

  let lastShake = 0;
  function onMotion(e){
    const a = e.accelerationIncludingGravity; if(!a) return;
    const mag = Math.sqrt((a.x||0)**2 + (a.y||0)**2 + (a.z||0)**2);
    const now = Date.now();
    if(mag > 18 && now - lastShake > 1500 && !busy){ lastShake = now; startShake(); }
  }

  /* ================================================================ */
  /* ============ v3 增强版：山水画卷背景 · 花瓣 · 道符 · 水墨 ============ */
  /* ================================================================ */
  (function(){
    const canvas = document.getElementById('ink-canvas');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    let W=0, H=0, dpr=1;
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

    const NUM_CLOUDS = 6;
    const NUM_PARTICLES = isTouch ? 12 : 24;
    const NUM_PETALS = isTouch ? 8 : 16;
    const NUM_SYMBOLS = 6;   // 浮动道符

    function resize(){
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    // ---- 水墨云气 ----
    const clouds = [];
    for(let i=0;i<NUM_CLOUDS;i++){
      clouds.push({
        x: Math.random()*W,
        y: Math.random()*H,
        r: 120 + Math.random()*180,
        vx: (Math.random()-0.5)*0.15,
        vy: (Math.random()-0.5)*0.10,
        opacity: 0.02 + Math.random()*0.035,
        phase: Math.random()*Math.PI*2,
        // 部分云气带朱印红色调
        tint: Math.random() < 0.15 ? 'seal' : 'ink'
      });
    }

    // ---- 浮尘微粒 ----
    const particles = [];
    for(let i=0;i<NUM_PARTICLES;i++){
      particles.push({
        x: Math.random()*W,
        y: Math.random()*H,
        r: 0.5 + Math.random()*1.5,
        vy: -0.1 - Math.random()*0.3,
        vx: (Math.random()-0.5)*0.05,
        opacity: 0.06 + Math.random()*0.10,
        phase: Math.random()*Math.PI*2
      });
    }

    // ---- 飘落花瓣 ----
    const petals = [];
    const petalColors = [
      'rgba(158,43,37,',   // 朱印红
      'rgba(184,134,11,',  // 暗金
      'rgba(43,43,43,',    // 墨色
    ];
    for(let i=0;i<NUM_PETALS;i++){
      petals.push({
        x: Math.random()*W,
        y: Math.random()*H - H,
        size: 4 + Math.random()*6,
        vy: 0.3 + Math.random()*0.6,
        vx: (Math.random()-0.5)*0.4,
        rot: Math.random()*Math.PI*2,
        vrot: (Math.random()-0.5)*0.02,
        opacity: 0.15 + Math.random()*0.20,
        color: petalColors[Math.floor(Math.random()*petalColors.length)],
        sway: Math.random()*Math.PI*2,
        swaySpeed: 0.01 + Math.random()*0.015
      });
    }

    // ---- 浮动道符/篆字 ----
    const daoSymbols = ['道','德','清','静','真','玄','虚','无','灵','仙'];
    const symbols = [];
    for(let i=0;i<NUM_SYMBOLS;i++){
      symbols.push({
        x: Math.random()*W,
        y: Math.random()*H,
        text: daoSymbols[Math.floor(Math.random()*daoSymbols.length)],
        size: 40 + Math.random()*60,
        vy: -0.05 - Math.random()*0.08,
        vx: (Math.random()-0.5)*0.03,
        opacity: 0.025 + Math.random()*0.025,
        rot: (Math.random()-0.5)*0.3,
        phase: Math.random()*Math.PI*2
      });
    }

    // ---- 鼠标墨痕（仅桌面） ----
    let mouseX = -100, mouseY = -100;
    const trail = [];
    const MAX_TRAIL = 30;
    if(!isTouch){
      window.addEventListener('mousemove', (e)=>{
        mouseX = e.clientX;
        mouseY = e.clientY;
        if(trail.length >= MAX_TRAIL) trail.shift();
        trail.push({x:mouseX, y:mouseY, life:1});
      });
    }

    function drawCloud(c, t){
      const breath = 1 + 0.08 * Math.sin(t*0.0005 + c.phase);
      const r = Math.max(1, c.r * breath);
      const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, r);
      if(c.tint === 'seal'){
        g.addColorStop(0, 'rgba(158,43,37,'+c.opacity+')');
        g.addColorStop(0.6, 'rgba(158,43,37,'+(c.opacity*0.3)+')');
        g.addColorStop(1, 'rgba(158,43,37,0)');
      } else {
        g.addColorStop(0, 'rgba(43,43,43,'+c.opacity+')');
        g.addColorStop(0.6, 'rgba(43,43,43,'+(c.opacity*0.4)+')');
        g.addColorStop(1, 'rgba(43,43,43,0)');
      }
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(c.x, c.y, r, 0, Math.PI*2);
      ctx.fill();
    }

    function drawParticle(p, t){
      const flicker = 0.5 + 0.5 * Math.sin(t*0.001 + p.phase);
      ctx.fillStyle = 'rgba(110,110,110,'+(p.opacity*flicker)+')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(0.3, p.r), 0, Math.PI*2);
      ctx.fill();
    }

    function drawPetal(p, t){
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      const alpha = p.opacity;
      // 花瓣形状：两段贝塞尔
      ctx.fillStyle = p.color + alpha + ')';
      ctx.beginPath();
      ctx.moveTo(0, -p.size);
      ctx.bezierCurveTo(p.size*0.6, -p.size*0.8, p.size*0.6, p.size*0.4, 0, p.size);
      ctx.bezierCurveTo(-p.size*0.6, p.size*0.4, -p.size*0.6, -p.size*0.8, 0, -p.size);
      ctx.fill();
      ctx.restore();
    }

    function drawSymbol(s, t){
      const breath = 0.7 + 0.3 * Math.sin(t*0.0008 + s.phase);
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.font = s.size + 'px "Kaiti SC","STKaiti","KaiTi",serif';
      ctx.fillStyle = 'rgba(43,43,43,'+(s.opacity*breath)+')';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(s.text, 0, 0);
      ctx.restore();
    }

    function drawTrail(){
      if(isTouch || trail.length<2) return;
      for(let i=1;i<trail.length;i++){
        const p1 = trail[i-1], p2 = trail[i];
        const alpha = (i/trail.length) * 0.06 * p2.life;
        if(alpha < 0.002) continue;
        ctx.strokeStyle = 'rgba(43,43,43,'+alpha+')';
        ctx.lineWidth = 1 + (i/trail.length)*2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
      for(let i=0;i<trail.length;i++){
        trail[i].life *= 0.96;
      }
      while(trail.length>0 && trail[0].life<0.01) trail.shift();
    }

    function animate(t){
      ctx.clearRect(0, 0, W, H);

      // 云气
      for(let i=0;i<clouds.length;i++){
        const c = clouds[i];
        c.x += c.vx;
        c.y += c.vy;
        if(c.x < -c.r) c.x = W + c.r;
        if(c.x > W + c.r) c.x = -c.r;
        if(c.y < -c.r) c.y = H + c.r;
        if(c.y > H + c.r) c.y = -c.r;
        drawCloud(c, t);
      }

      // 浮动道符（在云气之上、微粒之下）
      for(let i=0;i<symbols.length;i++){
        const s = symbols[i];
        s.y += s.vy;
        s.x += s.vx;
        if(s.y < -s.size){ s.y = H + s.size; s.x = Math.random()*W; }
        if(s.x < -s.size) s.x = W + s.size;
        if(s.x > W + s.size) s.x = -s.size;
        drawSymbol(s, t);
      }

      // 浮尘
      for(let i=0;i<particles.length;i++){
        const p = particles[i];
        p.y += p.vy;
        p.x += p.vx;
        if(p.y < -10){ p.y = H+10; p.x = Math.random()*W; }
        if(p.x < -10) p.x = W+10;
        if(p.x > W+10) p.x = -10;
        drawParticle(p, t);
      }

      // 花瓣
      for(let i=0;i<petals.length;i++){
        const p = petals[i];
        p.sway += p.swaySpeed;
        p.x += p.vx + Math.sin(p.sway) * 0.5;
        p.y += p.vy;
        p.rot += p.vrot;
        if(p.y > H + 20){ p.y = -20; p.x = Math.random()*W; }
        if(p.x < -20) p.x = W + 20;
        if(p.x > W + 20) p.x = -20;
        drawPetal(p, t);
      }

      // 鼠标墨痕
      drawTrail();

      requestAnimationFrame(animate);
    }

    if(!reduceMotion){
      requestAnimationFrame(animate);
    } else {
      for(let i=0;i<clouds.length;i++) drawCloud(clouds[i], 0);
      for(let i=0;i<symbols.length;i++) drawSymbol(symbols[i], 0);
      for(let i=0;i<particles.length;i++) drawParticle(particles[i], 0);
    }
  })();

  /* ============ 视差纵深（桌面端） ============ */
  (function(){
    if(window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return;
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    let targetX=0, targetY=0, curX=0, curY=0;

    window.addEventListener('mousemove', (e)=>{
      targetX = (e.clientX / window.innerWidth - 0.5) * 2;
      targetY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    function tick(){
      curX += (targetX - curX) * 0.05;
      curY += (targetY - curY) * 0.05;
      document.querySelectorAll('.parallax').forEach(el=>{
        const depth = parseFloat(el.dataset.depth || 0.5);
        const ox = curX * depth * 6;
        const oy = curY * depth * 6;
        el.style.transform = 'translate('+ox+'px,'+oy+'px)';
      });
      requestAnimationFrame(tick);
    }
    tick();
  })();
</script>
</body>
</html>
