<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国战积分 · 三国杀国战积分系统</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231a1a2e'/><text x='16' y='23' font-size='16' text-anchor='middle' fill='%23c62828' font-family='serif' font-weight='bold'>战</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1a2e;
  --ink-light:#16213e;
  --paper:#f5e6c8;
  --paper-dim:rgba(245,230,200,0.85);
  --paper-mute:rgba(245,230,200,0.5);
  --paper-faint:rgba(245,230,200,0.15);
  --cinnabar:#c62828;
  --cinnabar-light:#e53935;
  --bamboo:#2d5016;
  --bamboo-light:#4a7c2c;
  --gold:#d4a843;
  --border:rgba(245,230,200,0.2);
  --font-brush:"Ma Shan Zheng",cursive;
  --font-serif:"Noto Serif SC",serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--ink);color:var(--paper);font-family:var(--font-serif);-webkit-font-smoothing:antialiased;min-height:100vh;}
body{
  background:
    radial-gradient(ellipse at 20% 10%, rgba(198,40,40,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(45,80,22,0.05) 0%, transparent 50%),
    var(--ink);
}
::selection{background:var(--cinnabar);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* 纹理覆盖层 */
.texture{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  opacity:0.04;
  background-image:
    radial-gradient(circle at 25% 30%, rgba(245,230,200,0.3) 0.5px, transparent 1px),
    radial-gradient(circle at 75% 60%, rgba(245,230,200,0.2) 0.5px, transparent 1px);
  background-size:8px 8px,12px 12px;
}

/* 主容器 */
.app{position:relative;z-index:2;max-width:720px;margin:0 auto;padding:0 16px;min-height:100vh;display:flex;flex-direction:column;}

/* 页头 */
.header{
  padding:24px 0 16px;text-align:center;
  border-bottom:1px solid var(--border);
  margin-bottom:0;
}
.header-title{
  font-family:var(--font-brush);
  font-size:32px;color:var(--cinnabar);letter-spacing:0.1em;
  text-shadow:0 0 20px rgba(198,40,40,0.3);
}
.header-sub{
  font-size:12px;color:var(--paper-mute);letter-spacing:0.2em;
  margin-top:4px;
}
.season-badge{
  display:inline-block;margin-top:8px;
  padding:4px 16px;
  border:1px solid var(--gold);
  border-radius:4px;
  font-size:13px;color:var(--gold);
  letter-spacing:0.05em;
}
.season-badge.inactive{border-color:var(--paper-mute);color:var(--paper-mute);}

/* 排名榜 */
.standings{
  flex:1;
  padding:16px 0;
}
.standings-empty{
  text-align:center;padding:80px 0;
  color:var(--paper-mute);font-size:15px;letter-spacing:0.1em;
}
.standings-empty .big{
  font-family:var(--font-brush);font-size:24px;color:var(--paper-dim);
  margin-bottom:8px;
}

/* 排名行 */
.rank-row{
  display:flex;align-items:center;gap:12px;
  padding:14px 12px;
  border-bottom:1px solid var(--paper-faint);
  cursor:pointer;transition:background .2s;
  position:relative;
}
.rank-row:hover{background:var(--paper-faint);}
.rank-row.expanded{background:var(--paper-faint);}

.rank-num{
  font-family:var(--font-brush);
  font-size:24px;width:40px;text-align:center;
  color:var(--gold);flex-shrink:0;
}
.rank-row:first-child .rank-num{
  color:var(--cinnabar);font-size:28px;
  text-shadow:0 0 12px rgba(198,40,40,0.3);
}
.rank-row:nth-child(2) .rank-num{color:var(--paper-dim);}
.rank-row:nth-child(3) .rank-num{color:var(--bamboo-light);}

.rank-info{flex:1;min-width:0;}
.rank-name{
  font-size:16px;font-weight:700;color:var(--paper);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rank-meta{
  font-size:11px;color:var(--paper-mute);margin-top:2px;
  letter-spacing:0.05em;
}

.rank-score{
  font-family:var(--font-brush);
  font-size:28px;color:var(--cinnabar-light);
  flex-shrink:0;width:50px;text-align:right;
}

/* 展开明细 */
.rank-detail{
  display:none;
  padding:8px 12px 16px 52px;
  border-bottom:1px solid var(--paper-faint);
  background:rgba(0,0,0,0.15);
}
.rank-detail.show{display:block;}
.detail-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 0;
  font-size:12px;color:var(--paper-mute);
  border-bottom:1px dotted var(--paper-faint);
}
.detail-row:last-child{border-bottom:none;}
.detail-row .survivor{color:var(--gold);}
.detail-row .score-val{color:var(--cinnabar-light);font-weight:700;}

/* 浮动按钮组 */
.fab-group{
  position:fixed;right:16px;bottom:16px;z-index:100;
  display:flex;flex-direction:column;gap:10px;
}
.fab{
  width:52px;height:52px;border-radius:50%;
  border:1px solid var(--border);
  background:var(--ink-light);
  color:var(--paper-dim);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .25s;
  font-size:20px;
  box-shadow:0 4px 20px rgba(0,0,0,0.4);
}
.fab:hover{
  border-color:var(--cinnabar);color:var(--cinnabar);
  transform:translateY(-2px);
  box-shadow:0 6px 24px rgba(198,40,40,0.2);
}
.fab svg{width:22px;height:22px;}
.fab-label{
  position:absolute;right:60px;top:50%;transform:translateY(-50%);
  background:var(--ink-light);color:var(--paper-dim);
  padding:4px 10px;border-radius:4px;font-size:11px;
  white-space:nowrap;border:1px solid var(--border);
  opacity:0;transition:opacity .2s;pointer-events:none;
}
.fab:hover .fab-label{opacity:1;}

/* 弹窗 */
.overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,0.7);
  display:none;align-items:center;justify-content:center;
  padding:16px;
}
.overlay.show{display:flex;}
.modal{
  background:var(--ink-light);
  border:1px solid var(--border);
  border-radius:12px;
  width:100%;max-width:500px;max-height:85vh;
  display:flex;flex-direction:column;
  overflow:hidden;
  box-shadow:0 8px 40px rgba(0,0,0,0.5);
}
.modal-header{
  padding:16px 20px;
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.modal-title{
  font-family:var(--font-brush);font-size:20px;color:var(--cinnabar);
}
.modal-close{
  background:none;border:none;color:var(--paper-mute);
  font-size:22px;cursor:pointer;padding:0 4px;
}
.modal-close:hover{color:var(--paper);}
.modal-body{
  flex:1;overflow-y:auto;
  padding:20px;
}
.modal-footer{
  padding:12px 20px;
  border-top:1px solid var(--border);
  display:flex;gap:10px;justify-content:flex-end;
}

/* 表单元素 */
.form-group{margin-bottom:16px;}
.form-label{
  display:block;font-size:13px;color:var(--paper-mute);
  margin-bottom:6px;letter-spacing:0.05em;
}
.form-input{
  width:100%;padding:10px 12px;
  background:var(--ink);border:1px solid var(--border);
  border-radius:6px;color:var(--paper);font-size:14px;
  font-family:var(--font-serif);
}
.form-input:focus{outline:none;border-color:var(--cinnabar);}
.form-input::placeholder{color:var(--paper-mute);}

.btn{
  padding:8px 20px;border-radius:6px;
  font-family:var(--font-serif);font-size:14px;
  cursor:pointer;border:1px solid var(--border);
  transition:all .2s;
}
.btn-primary{
  background:var(--cinnabar);color:var(--paper);border-color:var(--cinnabar);
}
.btn-primary:hover{background:var(--cinnabar-light);}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
.btn-ghost{
  background:transparent;color:var(--paper-mute);
}
.btn-ghost:hover{color:var(--paper);border-color:var(--paper-mute);}

/* 玩家选择 */
.player-pick{
  display:flex;align-items:center;gap:8px;
  padding:10px;border:1px solid var(--border);border-radius:6px;
  margin-bottom:6px;cursor:pointer;transition:all .15s;
}
.player-pick:hover{border-color:var(--cinnabar);}
.player-pick.selected{
  border-color:var(--cinnabar);background:rgba(198,40,40,0.1);
}
.player-pick input{width:18px;height:18px;accent-color:var(--cinnabar);}
.player-pick label{flex:1;cursor:pointer;font-size:14px;}
.player-count{
  text-align:center;font-size:12px;color:var(--paper-mute);
  padding:8px 0;letter-spacing:0.1em;
}
.player-count.warn{color:var(--cinnabar);}

/* 淘汰排序 */
.sort-hint{
  font-size:12px;color:var(--paper-mute);
  margin-bottom:12px;line-height:1.6;
}
.sort-list{
  display:flex;flex-direction:column;gap:6px;
}
.sort-item{
  display:flex;align-items:center;gap:10px;
  padding:10px;border:1px solid var(--border);border-radius:6px;
  background:rgba(0,0,0,0.2);
  transition:all .2s;
}
.sort-item.survivor{
  border-color:var(--gold);
  background:rgba(212,168,67,0.08);
}
.sort-item.dragging{opacity:0.5;}
.sort-handle{
  cursor:grab;color:var(--paper-mute);font-size:18px;
  flex-shrink:0;padding:0 4px;
}
.sort-handle:active{cursor:grabbing;}
.sort-rank{
  font-family:var(--font-brush);font-size:18px;
  width:28px;text-align:center;flex-shrink:0;
  color:var(--gold);
}
.sort-name{flex:1;font-size:14px;}
.sort-score{
  font-family:var(--font-brush);font-size:20px;
  color:var(--cinnabar-light);width:36px;text-align:right;flex-shrink:0;
}
.sort-toggle{
  width:28px;height:28px;border-radius:50%;
  border:1px solid var(--border);background:transparent;
  color:var(--paper-mute);font-size:14px;cursor:pointer;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.sort-toggle.active{
  background:var(--gold);color:var(--ink);border-color:var(--gold);
}

.score-preview{
  margin-top:12px;padding:12px;
  background:rgba(0,0,0,0.2);border-radius:6px;
  border:1px solid var(--paper-faint);
}
.score-preview-title{
  font-size:12px;color:var(--paper-mute);
  margin-bottom:8px;letter-spacing:0.1em;
}
.score-preview-grid{
  display:flex;flex-wrap:wrap;gap:8px;
}
.score-chip{
  padding:4px 10px;border-radius:4px;
  font-size:12px;
  background:var(--paper-faint);
}
.score-chip.survivor{
  background:rgba(212,168,67,0.15);color:var(--gold);
}
.score-chip .val{color:var(--cinnabar-light);font-weight:700;margin-left:4px;}

/* 花名册列表 */
.roster-item{
  display:flex;align-items:center;gap:8px;
  padding:10px;border:1px solid var(--border);border-radius:6px;
  margin-bottom:6px;
}
.roster-item input{
  flex:1;background:transparent;border:none;color:var(--paper);
  font-size:14px;font-family:var(--font-serif);
}
.roster-item input:focus{outline:none;}
.roster-del{
  width:28px;height:28px;border-radius:4px;
  border:1px solid var(--border);background:transparent;
  color:var(--paper-mute);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.roster-del:hover{color:var(--cinnabar);border-color:var(--cinnabar);}

/* 赛季列表 */
.season-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px;border:1px solid var(--border);border-radius:6px;
  margin-bottom:6px;
}
.season-item.active{border-color:var(--gold);}
.season-item .s-name{font-size:14px;font-weight:700;}
.season-item .s-meta{font-size:11px;color:var(--paper-mute);margin-top:2px;}
.season-item .s-matches{font-size:12px;color:var(--gold);}
.season-item button{
  padding:4px 12px;font-size:12px;border-radius:4px;
  border:1px solid var(--cinnabar);background:transparent;
  color:var(--cinnabar);cursor:pointer;
}
.season-item button:hover{background:var(--cinnabar);color:var(--paper);}

/* Toast */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  z-index:300;padding:10px 24px;border-radius:6px;
  background:var(--ink-light);border:1px solid var(--border);
  color:var(--paper);font-size:14px;
  opacity:0;transition:opacity .3s,top .3s;
  top:-60px;
}
.toast.show{opacity:1;top:20px;}
.toast.error{border-color:var(--cinnabar);color:var(--cinnabar);}
.toast.success{border-color:var(--bamboo-light);color:var(--bamboo-light);}

/* 页脚 */
.footer{
  padding:16px 0;text-align:center;
  border-top:1px solid var(--border);
  font-size:11px;color:var(--paper-mute);letter-spacing:0.1em;
}

/* 响应式 */
@media(min-width:640px){
  .header-title{font-size:40px;}
  .fab-group{right:24px;bottom:24px;}
  .fab{width:56px;height:56px;}
}

/* 水墨装饰 */
.ink-corner{
  position:fixed;z-index:0;pointer-events:none;
  opacity:0.06;
}
.ink-corner.tl{top:0;left:0;width:200px;height:200px;
  background:radial-gradient(circle at 0% 0%, var(--cinnabar) 0%, transparent 60%);
}
.ink-corner.br{bottom:0;right:0;width:240px;height:240px;
  background:radial-gradient(circle at 100% 100%, var(--bamboo) 0%, transparent 60%);
}
</style>
</head>
<body>
  <div class="ink-corner tl"></div>
  <div class="ink-corner br"></div>
  <div class="texture"></div>

  <div class="app">
    <!-- 页头 -->
    <div class="header">
      <div class="header-title">国战积分</div>
      <div class="header-sub">三国杀国战积分系统</div>
      <div class="season-badge" id="seasonBadge">加载中...</div>
    </div>

    <!-- 排名榜 -->
    <div class="standings" id="standings"></div>

    <!-- 页脚 -->
    <div class="footer">心诚则灵 · 战绩为凭</div>
  </div>

  <!-- 浮动按钮 -->
  <div class="fab-group">
    <button class="fab" onclick="openModal('match')" title="录入成绩">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="fab" onclick="openModal('roster')" title="花名册">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/></svg>
    </button>
    <button class="fab" onclick="openModal('season')" title="赛季管理">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    </button>
  </div>

  <!-- 通用弹窗 -->
  <div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle"></span>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

<script>
// ============ 配置 ============
// 部署后替换为你的 Worker URL
const API_BASE = 'https://guozhan-scoring.menglongfan.workers.dev';

// ============ 状态 ============
let currentSeason = null;
let allPlayers = [];
let standingsData = [];
let expandedPlayerId = null;
let houseKey = '';

// ============ 工具 ============
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 2500);
}

async function api(path, opts={}) {
  const headers = { 'Content-Type': 'application/json', ...opts.headers };
  if (opts.auth && houseKey) headers['X-House-Key'] = houseKey;
  const res = await fetch(API_BASE + path, { ...opts, headers });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

// ============ 排名榜 ============
async function loadStandings(seasonId) {
  const url = seasonId ? `/api/standings?season_id=${seasonId}` : '/api/standings';
  const data = await api(url);
  currentSeason = data.season;
  standingsData = data.standings || [];
  renderStandings();
}

function renderStandings() {
  const badge = document.getElementById('seasonBadge');
  const container = document.getElementById('standings');

  if (!currentSeason) {
    badge.textContent = '暂无活跃赛季';
    badge.className = 'season-badge inactive';
    container.innerHTML = '<div class="standings-empty"><div class="big">尚无赛季</div>点击右下角日历按钮新建赛季</div>';
    return;
  }

  badge.textContent = currentSeason.name + (currentSeason.is_active ? '' : ' · 已结束');
  badge.className = currentSeason.is_active ? 'season-badge' : 'season-badge inactive';

  if (standingsData.length === 0) {
    container.innerHTML = '<div class="standings-empty"><div class="big">赛季尚未开始</div>等待第一局录入</div>';
    return;
  }

  container.innerHTML = standingsData.map((p, i) => `
    <div class="rank-row" onclick="toggleDetail(${p.id})" id="row-${p.id}">
      <div class="rank-num">${i + 1}</div>
      <div class="rank-info">
        <div class="rank-name">${escapeHtml(p.name)}</div>
        <div class="rank-meta">${p.match_count}局 · 存活${p.survival_count}次</div>
      </div>
      <div class="rank-score">${p.total_score}</div>
    </div>
    <div class="rank-detail" id="detail-${p.id}"></div>
  `).join('');
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ============ 玩家明细 ============
async function toggleDetail(playerId) {
  const detail = document.getElementById(`detail-${playerId}`);
  const row = document.getElementById(`row-${playerId}`);

  if (expandedPlayerId === playerId) {
    detail.classList.remove('show');
    row.classList.remove('expanded');
    expandedPlayerId = null;
    return;
  }

  if (expandedPlayerId) {
    document.getElementById(`detail-${expandedPlayerId}`)?.classList.remove('show');
    document.getElementById(`row-${expandedPlayerId}`)?.classList.remove('expanded');
  }

  expandedPlayerId = playerId;
  row.classList.add('expanded');
  detail.classList.add('show');
  detail.innerHTML = '<div style="text-align:center;color:var(--paper-mute);padding:8px;">加载中...</div>';

  try {
    const seasonParam = currentSeason ? `?season_id=${currentSeason.id}` : '';
    const data = await api(`/api/player/${playerId}/details${seasonParam}`);
    if (!data.details || data.details.length === 0) {
      detail.innerHTML = '<div style="color:var(--paper-mute);font-size:12px;">暂无对局记录</div>';
      return;
    }
    detail.innerHTML = data.details.map(d => `
      <div class="detail-row">
        <span>${d.played_at ? d.played_at.slice(0,16).replace('T',' ') : '—'} · 第${d.rank}名 ${d.is_survivor ? '<span class="survivor">存活</span>' : '淘汰'}</span>
        <span class="score-val">${d.score}分</span>
      </div>
    `).join('');
  } catch(e) {
    detail.innerHTML = `<div style="color:var(--cinnabar);font-size:12px;">加载失败：${e.message}</div>`;
  }
}

// ============ 弹窗系统 ============
function openModal(type) {
  if (type === 'match') {
    openMatchModal();
  } else if (type === 'roster') {
    openRosterModal();
  } else if (type === 'season') {
    openSeasonModal();
  }
}

function closeModal() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('modalBody').innerHTML = '';
  document.getElementById('modalFooter').innerHTML = '';
}

function setModal(title, bodyHtml, footerHtml='') {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFooter').innerHTML = footerHtml;
  document.getElementById('overlay').classList.add('show');
}

function authStep(title, onSuccess) {
  setModal(title, `
    <div class="form-group">
      <label class="form-label">房主密码</label>
      <input type="password" class="form-input" id="authInput" placeholder="输入房主密码" onkeydown="if(event.key==='Enter')doAuth()">
    </div>
  `, `<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="doAuth()">确认</button>`);

  document.getElementById('authInput').focus();

  window._authCallback = onSuccess;
}

function doAuth() {
  const val = document.getElementById('authInput').value;
  houseKey = val;
  api('/api/players', { auth: true }).then(() => {
    if (window._authCallback) window._authCallback();
  }).catch(() => {
    showToast('密码错误', 'error');
    houseKey = '';
  });
}

// ============ 花名册管理 ============
async function openRosterModal() {
  authStep('花名册管理', async () => {
    await loadPlayers();
    renderRosterModal();
  });
}

async function loadPlayers() {
  allPlayers = await api('/api/players');
}

function renderRosterModal() {
  const list = allPlayers.map(p => `
    <div class="roster-item">
      <input value="${escapeHtml(p.name)}" id="roster-${p.id}" onchange="updatePlayer(${p.id})">
      <button class="roster-del" onclick="deletePlayer(${p.id})" title="删除">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      </button>
    </div>
  `).join('');

  setModal('花名册管理', `
    ${list || '<div style="text-align:center;color:var(--paper-mute);padding:20px;">花名册为空，添加玩家开始</div>'}
    <div style="margin-top:16px;">
      <div class="form-group">
        <label class="form-label">添加新玩家</label>
        <div style="display:flex;gap:8px;">
          <input type="text" class="form-input" id="newPlayerName" placeholder="输入名字" onkeydown="if(event.key==='Enter')addPlayer()">
          <button class="btn btn-primary" onclick="addPlayer()">添加</button>
        </div>
      </div>
    </div>
  `, `<button class="btn btn-ghost" onclick="closeModal();loadStandings()">完成</button>`);
}

async function addPlayer() {
  const name = document.getElementById('newPlayerName').value.trim();
  if (!name) return;
  try {
    await api('/api/player', { method:'POST', auth:true, body:JSON.stringify({ name }) });
    document.getElementById('newPlayerName').value = '';
    await loadPlayers();
    renderRosterModal();
    showToast('已添加', 'success');
  } catch(e) { showToast(e.message, 'error'); }
}

async function updatePlayer(id) {
  const name = document.getElementById(`roster-${id}`).value.trim();
  if (!name) return;
  try {
    await api(`/api/player/${id}`, { method:'PUT', auth:true, body:JSON.stringify({ name }) });
    showToast('已更新', 'success');
  } catch(e) { showToast(e.message, 'error'); }
}

async function deletePlayer(id) {
  if (!confirm('确定删除？历史对局记录将保留。')) return;
  try {
    await api(`/api/player/${id}`, { method:'DELETE', auth:true });
    await loadPlayers();
    renderRosterModal();
    showToast('已删除', 'success');
  } catch(e) { showToast(e.message, 'error'); }
}

// ============ 成绩录入 ============
async function openMatchModal() {
  if (!currentSeason || !currentSeason.is_active) {
    showToast('请先新建赛季', 'error');
    openModal('season');
    return;
  }

  authStep('录入成绩', async () => {
    await loadPlayers();
    if (allPlayers.length < 5) {
      setModal('录入成绩', '<div style="text-align:center;color:var(--paper-mute);padding:20px;">花名册不足 5 人，请先添加玩家</div>',
        '<button class="btn btn-ghost" onclick="closeModal()">关闭</button>');
      return;
    }
    renderMatchStep1();
  });
}

let matchSelected = new Set();

function renderMatchStep1() {
  matchSelected.clear();
  const list = allPlayers.map(p => `
    <div class="player-pick" id="pick-${p.id}" onclick="togglePick(${p.id})">
      <input type="checkbox" id="chk-${p.id}">
      <label for="chk-${p.id}" onclick="event.preventDefault();togglePick(${p.id})">${escapeHtml(p.name)}</label>
    </div>
  `).join('');

  setModal('录入成绩 · 选人', `
    <div class="sort-hint">从花名册中勾选今天到场的 5-10 人</div>
    ${list}
    <div class="player-count" id="pickCount">已选 0 人</div>
  `, `<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" id="step1Next" onclick="renderMatchStep2()" disabled>下一步</button>`);
}

function togglePick(id) {
  const pick = document.getElementById(`pick-${id}`);
  const chk = document.getElementById(`chk-${id}`);
  if (matchSelected.has(id)) {
    matchSelected.delete(id);
    pick.classList.remove('selected');
    chk.checked = false;
  } else {
    if (matchSelected.size >= 10) { showToast('最多 10 人', 'error'); return; }
    matchSelected.add(id);
    pick.classList.add('selected');
    chk.checked = true;
  }
  const count = matchSelected.size;
  const el = document.getElementById('pickCount');
  el.textContent = `已选 ${count} 人`;
  el.className = 'player-count' + (count < 5 || count > 10 ? ' warn' : '');
  document.getElementById('step1Next').disabled = count < 5 || count > 10;
}

let matchOrder = []; // [{player_id, name, is_survivor}]

function renderMatchStep2() {
  matchOrder = Array.from(matchSelected).map(id => {
    const p = allPlayers.find(x => x.id === id);
    return { player_id: id, name: p.name, is_survivor: 0 };
  });
  renderSortList();
}

function renderSortList() {
  const total = matchOrder.length;
  const survivors = matchOrder.filter(r => r.is_survivor).length;
  const dead = total - survivors;
  const topScore = dead + 1;

  // 计算预览分数
  const deadList = matchOrder.filter(r => !r.is_survivor);
  matchOrder.forEach(r => {
    if (r.is_survivor) {
      r.score = topScore;
    } else {
      const idx = deadList.indexOf(r);
      r.score = dead - idx;
    }
  });

  const list = matchOrder.map((r, i) => `
    <div class="sort-item ${r.is_survivor ? 'survivor' : ''}" id="sort-${i}" draggable="true"
         ondragstart="dragStart(${i})" ondragover="event.preventDefault()" ondrop="dragDrop(${i})" ondragend="dragEnd()">
      <span class="sort-handle">::</span>
      <span class="sort-rank">${i + 1}</span>
      <span class="sort-name">${escapeHtml(r.name)}</span>
      <span class="sort-score">${r.score}</span>
      <button class="sort-toggle ${r.is_survivor ? 'active' : ''}" onclick="toggleSurvivor(${i})" title="存活/淘汰">${r.is_survivor ? '存' : '亡'}</button>
    </div>
  `).join('');

  const preview = matchOrder.map(r => `
    <span class="score-chip ${r.is_survivor ? 'survivor' : ''}">${escapeHtml(r.name)}<span class="val">${r.score}</span></span>
  `).join('');

  setModal('录入成绩 · 排序', `
    <div class="sort-hint">拖拽排列淘汰顺序（上 = 最后存活，下 = 先出局）。点击右侧按钮标记存活者。</div>
    <div class="sort-list">${list}</div>
    <div class="score-preview">
      <div class="score-preview-title">分数预览 · 最高 ${topScore} 分</div>
      <div class="score-preview-grid">${preview}</div>
    </div>
  `, `<button class="btn btn-ghost" onclick="renderMatchStep1()">上一步</button><button class="btn btn-primary" onclick="submitMatch()">提交</button>`);
}

let dragIndex = null;
function dragStart(i) {
  dragIndex = i;
  document.getElementById(`sort-${i}`).classList.add('dragging');
}
function dragEnd() {
  document.querySelectorAll('.sort-item').forEach(el => el.classList.remove('dragging'));
}
function dragDrop(targetIndex) {
  if (dragIndex === null || dragIndex === targetIndex) return;
  const [moved] = matchOrder.splice(dragIndex, 1);
  matchOrder.splice(targetIndex, 0, moved);
  dragIndex = null;
  renderSortList();
}

function toggleSurvivor(i) {
  matchOrder[i].is_survivor = matchOrder[i].is_survivor ? 0 : 1;
  renderSortList();
}

async function submitMatch() {
  // 生成 rank
  const results = matchOrder.map((r, i) => ({
    player_id: r.player_id,
    rank: i + 1,
    is_survivor: r.is_survivor
  }));

  try {
    await api('/api/match', {
      method: 'POST', auth: true,
      body: JSON.stringify({ season_id: currentSeason.id, results })
    });
    closeModal();
    await loadStandings();
    showToast('成绩已录入', 'success');
  } catch(e) {
    showToast(e.message, 'error');
  }
}

// ============ 赛季管理 ============
async function openSeasonModal() {
  authStep('赛季管理', async () => {
    await renderSeasonModal();
  });
}

async function renderSeasonModal() {
  const seasons = await api('/api/seasons');
  const list = seasons.map(s => `
    <div class="season-item ${s.is_active ? 'active' : ''}">
      <div>
        <div class="s-name">${escapeHtml(s.name)}</div>
        <div class="s-meta">${s.started_at ? s.started_at.slice(0,10) : ''} ${s.ended_at ? '→ '+s.ended_at.slice(0,10) : ''}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="s-matches">${s.match_count}局</span>
        ${s.is_active ? `<button onclick="endSeason(${s.id})">结束</button>` : `<button onclick="viewSeason(${s.id})">查看</button>`}
      </div>
    </div>
  `).join('');

  setModal('赛季管理', `
    ${list || '<div style="text-align:center;color:var(--paper-mute);padding:20px;">暂无赛季</div>'}
    <div style="margin-top:16px;">
      <div class="form-group">
        <label class="form-label">新建赛季</label>
        <div style="display:flex;gap:8px;">
          <input type="text" class="form-input" id="newSeasonName" placeholder="如：2026秋季赛" onkeydown="if(event.key==='Enter')createSeason()">
          <button class="btn btn-primary" onclick="createSeason()">新建</button>
        </div>
      </div>
    </div>
  `, `<button class="btn btn-ghost" onclick="closeModal();loadStandings()">完成</button>`);
}

async function createSeason() {
  const name = document.getElementById('newSeasonName').value.trim();
  if (!name) return;
  try {
    await api('/api/season', { method:'POST', auth:true, body:JSON.stringify({ name }) });
    await renderSeasonModal();
    showToast('赛季已创建', 'success');
  } catch(e) { showToast(e.message, 'error'); }
}

async function endSeason(id) {
  if (!confirm('确定结束当前赛季？结束后排名归档，新对局记入新赛季。')) return;
  try {
    await api(`/api/season/${id}/end`, { method:'POST', auth:true });
    await renderSeasonModal();
    showToast('赛季已结束', 'success');
  } catch(e) { showToast(e.message, 'error'); }
}

function viewSeason(id) {
  closeModal();
  loadStandings(id);
}

// ============ 初始化 ============
async function init() {
  try {
    await loadStandings();
  } catch(e) {
    document.getElementById('standings').innerHTML =
      `<div class="standings-empty"><div class="big">连接失败</div>${escapeHtml(e.message)}</div>`;
  }
}

init();
</script>
