<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国战积分 · 三国杀国战积分系统</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230d0d12'/><text x='16' y='23' font-size='16' text-anchor='middle' fill='%238B1A1A' font-family='serif' font-weight='bold'>战</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
/* ============ 设计令牌：朱砂将帅帐 ============ */
:root{
  --void:#0d0d12;
  --abyss:#12121a;
  --ink:#161620;
  --slate:#1a1a28;
  --card:#1e1e2e;
  --paper:#ede0c4;
  --paper-bright:#f4e9d0;
  --paper-dim:rgba(237,224,196,0.78);
  --paper-mute:rgba(237,224,196,0.45);
  --paper-faint:rgba(237,224,196,0.1);
  --paper-ghost:rgba(237,224,196,0.04);
  --cinnabar:#8B1A1A;
  --cinnabar-bright:#c4392c;
  --cinnabar-glow:rgba(139,26,26,0.3);
  --vermilion:#d4422e;
  --gold:#bfa15a;
  --gold-bright:#e0c478;
  --gold-glow:rgba(191,161,90,0.25);
  --jade:#2d6b4f;
  --jade-bright:#4a9c6e;
  --border:rgba(237,224,196,0.12);
  --border-bright:rgba(237,224,196,0.22);
  --font-brush:"Ma Shan Zheng",cursive;
  --font-serif:"Noto Serif SC",serif;
  --font-label:"ZCOOL XiaoWei",serif;
  --radius:6px;
  --shadow-sm:0 2px 12px rgba(0,0,0,0.5);
  --shadow:0 4px 24px rgba(0,0,0,0.6);
  --shadow-lg:0 12px 48px rgba(0,0,0,0.7);
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--void);color:var(--paper);font-family:var(--font-serif);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;}
body{
  background:
    radial-gradient(ellipse 80% 50% at 30% 0%, rgba(139,26,26,0.1) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(45,107,79,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 100% 50% at 50% 50%, rgba(191,161,90,0.02) 0%, transparent 70%),
    linear-gradient(180deg, var(--void) 0%, var(--abyss) 100%);
  min-height:100vh;
  position:relative;
}
::selection{background:var(--cinnabar);color:var(--paper-bright);}
a{color:inherit;text-decoration:none;}

/* 纸纹噪点 */
.noise{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  opacity:0.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* 山峦剪影 */
.mountains{
  position:fixed;bottom:0;left:0;right:0;z-index:0;pointer-events:none;
  width:100%;height:120px;opacity:0.08;
}

/* 朱砂角落 */
.ink-bloom{
  position:fixed;z-index:0;pointer-events:none;
  border-radius:50%;filter:blur(40px);
}
.ink-bloom.tl{top:-80px;left:-80px;width:300px;height:300px;background:radial-gradient(circle, var(--cinnabar) 0%, transparent 65%);opacity:0.08;}
.ink-bloom.br{bottom:-60px;right:-60px;width:260px;height:260px;background:radial-gradient(circle, var(--jade) 0%, transparent 65%);opacity:0.06;}
.ink-bloom.mid{top:40%;right:-100px;width:200px;height:200px;background:radial-gradient(circle, var(--gold) 0%, transparent 65%);opacity:0.04;}

/* ============ 主容器 ============ */
.app{position:relative;z-index:2;max-width:680px;margin:0 auto;padding:0 20px;min-height:100vh;display:flex;flex-direction:column;}

/* ============ 页头：军帐幡旗 ============ */
.header{
  padding:36px 0 20px;text-align:center;
  position:relative;
}
.header::before,.header::after{
  content:'';position:absolute;bottom:0;height:1px;
  background:linear-gradient(90deg, transparent, var(--cinnabar) 40%, var(--cinnabar) 60%, transparent);
  opacity:0.4;
}
.header::before{left:10%;right:10%;}
.header::after{left:20%;right:20%;bottom:-4px;opacity:0.2;}

.header-ornament{
  display:flex;align-items:center;justify-content:center;gap:12px;
  margin-bottom:4px;
}
.header-ornament .line{
  width:40px;height:1px;
  background:linear-gradient(90deg, transparent, var(--gold));
  opacity:0.5;
}
.header-ornament .line.r{background:linear-gradient(90deg, var(--gold), transparent);}
.header-ornament .diamond{
  width:6px;height:6px;background:var(--gold);
  transform:rotate(45deg);opacity:0.6;
}

.header-title{
  font-family:var(--font-brush);
  font-size:38px;color:var(--vermilion);letter-spacing:0.2em;
  text-shadow:0 0 40px rgba(196,57,44,0.3), 0 2px 4px rgba(0,0,0,0.5);
  animation:revealDown .8s cubic-bezier(.22,1,.36,1);
  position:relative;
}
.header-sub{
  font-family:var(--font-label);
  font-size:12px;color:var(--paper-mute);letter-spacing:0.35em;
  margin-top:8px;
  animation:fadeIn 1s ease .2s backwards;
}

.season-badge{
  display:inline-flex;align-items:center;gap:8px;margin-top:14px;
  padding:6px 20px;
  border:1px solid var(--gold);
  border-radius:0;
  font-family:var(--font-label);
  font-size:13px;color:var(--gold-bright);
  letter-spacing:0.08em;
  background:linear-gradient(135deg, rgba(191,161,90,0.08), rgba(191,161,90,0.02));
  transition:all .3s;
  position:relative;
  clip-path:polygon(8px 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 8px 100%, 0 50%);
  animation:fadeIn 1s ease .4s backwards;
}
.season-badge.inactive{border-color:var(--paper-mute);color:var(--paper-mute);background:transparent;}
.season-badge .dot{
  width:6px;height:6px;border-radius:50%;background:var(--gold-bright);
  animation:breathe 2.5s ease infinite;
  box-shadow:0 0 8px var(--gold-glow);
}
.season-badge.inactive .dot{background:var(--paper-mute);box-shadow:none;animation:none;}

/* ============ 排名榜 ============ */
.standings{
  flex:1;
  padding:12px 0;
}

.standings-empty{
  text-align:center;padding:80px 20px;
  color:var(--paper-mute);font-size:13px;letter-spacing:0.1em;
  animation:fadeIn .6s ease;
}
.standings-empty .seal{
  width:80px;height:80px;margin:0 auto 24px;
  border:2px solid var(--cinnabar);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-brush);font-size:32px;color:var(--cinnabar);
  opacity:0.15;
  border-radius:8px;
  transform:rotate(-3deg);
}
.standings-empty .big{
  font-family:var(--font-brush);font-size:24px;color:var(--paper-dim);
  margin-bottom:8px;
}

/* 骨架屏 */
.skeleton-row{
  display:flex;align-items:center;gap:14px;
  padding:18px 16px;
}
.skeleton-bar{
  background:var(--paper-ghost);
  border-radius:3px;
  animation:shimmer 1.8s ease infinite;
}
.skeleton-avatar{width:40px;height:40px;border-radius:50%;}
.skeleton-name{flex:1;height:14px;}
.skeleton-score{width:48px;height:22px;}

/* ============ 排名行：军帖样式 ============ */
.rank-row{
  display:flex;align-items:center;gap:14px;
  padding:16px 16px;
  border-bottom:1px solid var(--paper-ghost);
  cursor:pointer;transition:all .3s cubic-bezier(.22,1,.36,1);
  position:relative;
  animation:slideIn .5s cubic-bezier(.22,1,.36,1) backwards;
}
.rank-row:hover{background:var(--paper-ghost);}
.rank-row.expanded{background:var(--paper-ghost);}

/* 头像 */
.rank-avatar{
  width:40px;height:40px;border-radius:50%;
  flex-shrink:0;
  overflow:hidden;
  border:2px solid var(--border);
  transition:all .3s;
  position:relative;
  background:var(--paper-ghost);
}
.rank-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.rank-avatar .avatar-placeholder{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-brush);font-size:18px;color:var(--paper-mute);
  background:var(--paper-ghost);
}
.rank-row:hover .rank-avatar{border-color:var(--border-bright);}

/* 前三名头像光晕 */
.rank-row:nth-child(1) .rank-avatar{
  border-color:var(--cinnabar);
  box-shadow:0 0 12px var(--cinnabar-glow);
}
.rank-row:nth-child(2) .rank-avatar{
  border-color:var(--paper-dim);
  box-shadow:0 0 8px rgba(237,224,196,0.15);
}
.rank-row:nth-child(3) .rank-avatar{
  border-color:var(--gold);
  box-shadow:0 0 10px var(--gold-glow);
}

.rank-seal{
  position:absolute;
  top:-4px;left:-4px;
  width:20px;height:20px;
  border-radius:50%;
  background:var(--card);
  border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-brush);font-size:11px;
  color:var(--paper-mute);
  z-index:1;
}
.rank-row:nth-child(1) .rank-seal{border-color:var(--cinnabar);color:var(--vermilion);background:var(--void);}
.rank-row:nth-child(2) .rank-seal{border-color:var(--paper-dim);color:var(--paper-bright);background:var(--void);}
.rank-row:nth-child(3) .rank-seal{border-color:var(--gold);color:var(--gold-bright);background:var(--void);}

.rank-info{flex:1;min-width:0;}
.rank-name{
  font-size:16px;font-weight:600;color:var(--paper-bright);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:0.03em;
}
.rank-meta{
  font-family:var(--font-label);
  font-size:11px;color:var(--paper-mute);margin-top:4px;
  letter-spacing:0.06em;
  display:flex;align-items:center;gap:6px;
}
.rank-meta .sep{opacity:0.4;}
.rank-meta .survival{color:var(--gold);}

.rank-score{
  font-family:var(--font-brush);
  font-size:28px;color:var(--vermilion);
  flex-shrink:0;min-width:56px;text-align:right;
  line-height:1;
  transition:all .3s;
  text-shadow:0 0 20px rgba(196,57,44,0.15);
}
.rank-row:hover .rank-score{transform:scale(1.06);}
.rank-score .unit{
  font-family:var(--font-label);
  font-size:10px;color:var(--paper-mute);
  display:block;text-align:center;margin-top:2px;
  text-shadow:none;
}

/* ============ 展开明细 ============ */
.rank-detail{
  max-height:0;overflow:hidden;
  padding:0 16px 0 70px;
  background:rgba(0,0,0,0.25);
  transition:max-height .4s cubic-bezier(.22,1,.36,1);
}
.rank-detail.show{max-height:500px;padding:10px 16px 16px 70px;}

.detail-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;
  font-family:var(--font-label);
  font-size:12px;color:var(--paper-mute);
  border-bottom:1px solid var(--paper-ghost);
}
.detail-row:last-child{border-bottom:none;}
.detail-row .stamp{
  display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;border-radius:3px;
  font-size:11px;font-weight:700;font-family:var(--font-serif);
  margin-right:8px;
}
.detail-row .stamp.alive{background:rgba(191,161,90,0.15);color:var(--gold-bright);border:1px solid rgba(191,161,90,0.3);}
.detail-row .stamp.dead{background:rgba(237,224,196,0.04);color:var(--paper-mute);border:1px solid var(--border);}
.detail-row .score-val{color:var(--vermilion);font-weight:700;font-family:var(--font-brush);font-size:16px;}

/* ============ 浮动按钮：印章纽 ============ */
.fab-group{
  position:fixed;right:20px;bottom:24px;z-index:100;
  display:flex;flex-direction:column;gap:12px;
}
.fab{
  width:50px;height:50px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--paper-dim);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .35s cubic-bezier(.22,1,.36,1);
  box-shadow:var(--shadow);
  position:relative;
  border-radius:10px;
}
.fab::before{
  content:'';position:absolute;inset:3px;
  border:1px solid var(--paper-ghost);
  border-radius:7px;
  transition:all .35s;
}
.fab:hover{
  border-color:var(--cinnabar);color:var(--vermilion);
  transform:translateY(-3px);
  box-shadow:0 8px 32px var(--cinnabar-glow);
}
.fab:hover::before{border-color:var(--cinnabar-glow);}
.fab:active{transform:translateY(-1px);}
.fab svg{width:20px;height:20px;position:relative;z-index:1;}
.fab-label{
  position:absolute;right:58px;top:50%;transform:translateY(-50%) translateX(8px);
  background:var(--card);color:var(--paper-dim);
  padding:5px 14px;
  font-family:var(--font-label);font-size:11px;letter-spacing:0.08em;
  white-space:nowrap;border:1px solid var(--border);
  border-radius:4px;
  opacity:0;transition:all .3s;pointer-events:none;
}
.fab:hover .fab-label{opacity:1;transform:translateY(-50%) translateX(0);}

/* ============ 弹窗：军帖卷轴 ============ */
.overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(5,5,10,0.8);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;
  padding:16px;
}
.overlay.show{display:flex;animation:fadeIn .25s ease;}

.modal{
  background:linear-gradient(180deg, var(--card) 0%, var(--slate) 100%);
  border:1px solid var(--border);
  border-radius:var(--radius);
  width:100%;max-width:480px;max-height:85vh;
  display:flex;flex-direction:column;
  overflow:hidden;
  box-shadow:var(--shadow-lg);
  animation:scrollOpen .4s cubic-bezier(.22,1,.36,1);
  position:relative;
}
/* 卷轴装饰角 */
.modal::before,.modal::after{
  content:'';position:absolute;width:24px;height:24px;
  border:1px solid var(--gold);
  opacity:0.3;
  pointer-events:none;
}
.modal::before{top:8px;left:8px;border-right:none;border-bottom:none;}
.modal::after{bottom:8px;right:8px;border-left:none;border-top:none;}

.modal-header{
  padding:18px 24px;
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  position:relative;
}
.modal-header::after{
  content:'';position:absolute;bottom:-1px;left:24px;right:24px;height:1px;
  background:linear-gradient(90deg, transparent, var(--cinnabar) 30%, var(--cinnabar) 70%, transparent);
  opacity:0.3;
}
.modal-title{
  font-family:var(--font-brush);font-size:20px;color:var(--vermilion);
  letter-spacing:0.1em;
}
.modal-close{
  background:none;border:none;color:var(--paper-mute);
  font-size:24px;cursor:pointer;padding:0 4px;
  transition:all .2s;line-height:1;
}
.modal-close:hover{color:var(--paper-bright);transform:rotate(90deg);}
.modal-body{
  flex:1;overflow-y:auto;
  padding:24px;
}
.modal-body::-webkit-scrollbar{width:3px;}
.modal-body::-webkit-scrollbar-track{background:transparent;}
.modal-body::-webkit-scrollbar-thumb{background:var(--paper-faint);border-radius:2px;}
.modal-footer{
  padding:14px 24px;
  border-top:1px solid var(--border);
  display:flex;gap:10px;justify-content:flex-end;
  background:var(--paper-ghost);
}

/* ============ 表单元素：竹简风 ============ */
.form-group{margin-bottom:18px;}
.form-label{
  display:block;font-family:var(--font-label);
  font-size:11px;color:var(--paper-mute);
  margin-bottom:8px;letter-spacing:0.12em;
}
.form-input{
  width:100%;padding:10px 0;
  background:transparent;
  border:none;
  border-bottom:1px solid var(--border);
  color:var(--paper-bright);font-size:15px;font-weight:600;
  font-family:var(--font-serif);
  transition:all .3s;
  border-radius:0;
}
.form-input:focus{outline:none;border-bottom-color:var(--cinnabar);}
.form-input::placeholder{color:var(--paper-mute);opacity:0.5;font-weight:400;}

/* ============ 按钮：印章方块 ============ */
.btn{
  padding:10px 24px;
  font-family:var(--font-serif);font-size:14px;font-weight:700;
  cursor:pointer;
  border:1px solid var(--border);
  transition:all .25s cubic-bezier(.22,1,.36,1);
  display:inline-flex;align-items:center;gap:6px;
  border-radius:var(--radius);
  letter-spacing:0.05em;
  position:relative;overflow:hidden;
}
.btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,0.06) 0%, transparent 50%);
  opacity:0;transition:opacity .25s;
}
.btn:hover::before{opacity:1;}

.btn-primary{
  background:var(--cinnabar);color:var(--paper-bright);border-color:var(--cinnabar);
  box-shadow:0 2px 12px var(--cinnabar-glow);
}
.btn-primary:hover{background:var(--cinnabar-bright);transform:translateY(-1px);box-shadow:0 4px 20px var(--cinnabar-glow);}
.btn-primary:active{transform:translateY(0);box-shadow:0 2px 8px var(--cinnabar-glow);}
.btn-primary:disabled{opacity:0.3;cursor:not-allowed;transform:none;box-shadow:none;background:var(--cinnabar);}

.btn-ghost{
  background:transparent;color:var(--paper-mute);
}
.btn-ghost:hover{color:var(--paper-bright);border-color:var(--paper-mute);}

.btn-gold{
  background:transparent;color:var(--gold-bright);border-color:var(--gold);
}
.btn-gold:hover{background:var(--gold);color:var(--void);}

/* ============ 玩家选择：点兵卡 ============ */
.player-pick-list{display:flex;flex-direction:column;gap:6px;}
.player-pick{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  cursor:pointer;transition:all .25s;
  background:var(--paper-ghost);
}
.player-pick:hover{border-color:var(--border-bright);background:rgba(237,224,196,0.06);}
.player-pick.selected{
  border-color:var(--cinnabar);background:rgba(139,26,26,0.08);
}
.player-pick .check{
  width:24px;height:24px;
  border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .25s;
  border-radius:4px;
  background:var(--void);
}
.player-pick.selected .check{
  background:var(--cinnabar);border-color:var(--cinnabar);
  box-shadow:0 0 8px var(--cinnabar-glow);
}
.player-pick .check svg{opacity:0;transform:scale(0.3);transition:all .25s;}
.player-pick.selected .check svg{opacity:1;transform:scale(1);}
.player-pick label{flex:1;cursor:pointer;font-size:15px;font-weight:600;color:var(--paper-bright);}

.pick-avatar{
  width:32px;height:32px;border-radius:50%;
  flex-shrink:0;
  overflow:hidden;
  border:1.5px solid var(--border);
  background:var(--paper-ghost);
}
.pick-avatar img{width:100%;height:100%;object-fit:cover;}

.pick-actions{display:flex;gap:8px;margin-bottom:10px;}
.pick-actions button{
  font-family:var(--font-label);font-size:11px;
  padding:6px 16px;border-radius:var(--radius);
  border:1px solid var(--border);background:transparent;
  color:var(--paper-mute);cursor:pointer;transition:all .2s;
  letter-spacing:0.08em;
}
.pick-actions button:hover{color:var(--gold-bright);border-color:var(--gold);}

.player-count{
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--font-label);
  font-size:12px;color:var(--paper-mute);
  padding:12px 4px;letter-spacing:0.1em;
}
.player-count.warn{color:var(--vermilion);}
.player-count.ok{color:var(--jade-bright);}

/* ============ 淘汰排序：战报 ============ */
.sort-hint{
  font-family:var(--font-label);
  font-size:12px;color:var(--paper-mute);
  margin-bottom:16px;line-height:1.8;
  padding:12px 16px;
  background:var(--paper-ghost);
  border-left:2px solid var(--gold);
  border-radius:0 var(--radius) var(--radius) 0;
}
.sort-hint b{color:var(--gold-bright);font-weight:700;}

.sort-list{display:flex;flex-direction:column;gap:6px;}
.sort-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;
  border:1px solid var(--border);border-radius:var(--radius);
  background:var(--paper-ghost);
  transition:all .25s;

<script>
const API_BASE = 'https://guozhan-scoring.menglongfan.workers.dev';

let currentSeason = null;
let allPlayers = [];
let standingsData = [];
let expandedPlayerId = null;
let houseKey = '';

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 2500);
}

async function api(path, opts={}) {
  const headers = { 'Content-Type': 'application/json', ...opts.headers };
  if (opts.auth && houseKey) headers['X-House-Key'] = houseKey;
  const res = await fetch(API_BASE + path, { ...opts, headers });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function avatarImg(url, name, sizeClass='') {
  if (url) {
    return `<img src="${escapeHtml(url)}" alt="${escapeHtml(name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
      <div class="avatar-placeholder" style="display:none;">${name ? name.charAt(0) : '?'}</div>`;
  }
  return `<div class="avatar-placeholder">${name ? name.charAt(0) : '?'}</div>`;
}

function getISOWeek(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
}

function getDefaultSeasonName() {
  const now = new Date();
  const year = now.getFullYear();
  const week = getISOWeek(now);
  return `${year}年第${week}周`;
}

async function loadStandings(seasonId) {
  showSkeleton();
  try {
    const url = seasonId ? `/api/standings?season_id=${seasonId}` : '/api/standings';
    const data = await api(url);
    currentSeason = data.season;
    standingsData = data.standings || [];
    renderStandings();
  } catch(e) {
    document.getElementById('standings').innerHTML =
      `<div class="standings-empty"><div class="seal">败</div><div class="big">连接失败</div>${escapeHtml(e.message)}</div>`;
  }
}

function showSkeleton() {
  const container = document.getElementById('standings');
  container.innerHTML = Array(5).fill(0).map(() => `
    <div class="skeleton-row">
      <div class="skeleton-bar skeleton-avatar"></div>
      <div class="skeleton-bar skeleton-name"></div>
      <div class="skeleton-bar skeleton-score"></div>
    </div>
  `).join('');
}

function renderStandings() {
  const badge = document.getElementById('seasonBadge');
  const container = document.getElementById('standings');

  if (!currentSeason) {
    badge.innerHTML = '<span class="dot"></span>暂无活跃赛季';
    badge.className = 'season-badge inactive';
    container.innerHTML = `
      <div class="standings-empty">
        <div class="seal">令</div>
        <div class="big">尚无赛季</div>
        <div>点击右下角日历按钮新建赛季</div>
      </div>`;
    return;
  }

  badge.innerHTML = `<span class="dot"></span>${escapeHtml(currentSeason.name)}${currentSeason.is_active ? '' : ' · 已结束'}`;
  badge.className = currentSeason.is_active ? 'season-badge' : 'season-badge inactive';

  if (standingsData.length === 0) {
    container.innerHTML = `
      <div class="standings-empty">
        <div class="seal">空</div>
        <div class="big">赛季尚未开始</div>
        <div>等待第一局录入</div>
      </div>`;
    return;
  }

  container.innerHTML = standingsData.map((p, i) => `
    <div class="rank-row" style="animation-delay:${i * 0.06}s" onclick="toggleDetail(${p.id})" id="row-${p.id}">
      <div class="rank-avatar">
        <div class="rank-seal">${i + 1}</div>
        ${avatarImg(p.avatar_url, p.name)}
      </div>
      <div class="rank-info">
        <div class="rank-name">${escapeHtml(p.name)}</div>
        <div class="rank-meta">
          <span>${p.match_count}局</span>
          <span class="sep">·</span>
          <span class="survival">存活${p.survival_count}次</span>
        </div>
      </div>
      <div class="rank-score">${p.total_score}<span class="unit">分</span></div>
    </div>
    <div class="rank-detail" id="detail-${p.id}"></div>
  `).join('');
}

async function toggleDetail(playerId) {
  const detail = document.getElementById(`detail-${playerId}`);
  const row = document.getElementById(`row-${playerId}`);

  if (expandedPlayerId === playerId) {
    detail.classList.remove('show');
    row.classList.remove('expanded');
    expandedPlayerId = null;
    return;
  }

  if (expandedPlayerId) {
    document.getElementById(`detail-${expandedPlayerId}`)?.classList.remove('show');
    document.getElementById(`row-${expandedPlayerId}`)?.classList.remove('expanded');
  }

  expandedPlayerId = playerId;
  row.classList.add('expanded');
  detail.classList.add('show');
  detail.innerHTML = '<div style="text-align:center;color:var(--paper-mute);padding:12px;font-family:var(--font-label);font-size:12px;">加载中...</div>';

  try {
    const seasonParam = currentSeason ? `?season_id=${currentSeason.id}` : '';
    const data = await api(`/api/player/${playerId}/details${seasonParam}`);
    if (!data.details || data.details.length === 0) {
      detail.innerHTML = '<div style="color:var(--paper-mute);font-size:12px;text-align:center;padding:8px;font-family:var(--font-label);">暂无对局记录</div>';
      return;
    }
    detail.innerHTML = data.details.map(d => `
      <div class="detail-row">
        <span>
          <span class="stamp ${d.is_survivor ? 'alive' : 'dead'}">${d.is_survivor ? '存' : '亡'}</span>
          ${d.played_at ? d.played_at.slice(5,16).replace('T',' ') : '—'}
          <span class="sep">·</span>第${d.rank}名
        </span>
        <span class="score-val">${d.score}分</span>
      </div>
    `).join('');
  } catch(e) {
    detail.innerHTML = `<div style="color:var(--vermilion);font-size:12px;font-family:var(--font-label);">加载失败：${e.message}</div>`;
  }
}

function openModal(type) {
  if (type === 'match') openMatchModal();
  else if (type === 'roster') openRosterModal();
  else if (type === 'season') openSeasonModal();
  else if (type === 'prize') openPrizeModal();
}

function closeModal() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('modalBody').innerHTML = '';
  document.getElementById('modalFooter').innerHTML = '';
}

function setModal(title, bodyHtml, footerHtml='') {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFooter').innerHTML = footerHtml;
  document.getElementById('overlay').classList.add('show');
}

function authStep(title, onSuccess) {
  setModal(title, `
    <div class="form-group">
      <label class="form-label">房主密码</label>
      <input type="password" class="form-input" id="authInput" placeholder="输入房主密码" onkeydown="if(event.key==='Enter')doAuth()">
    </div>
  `, `<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="doAuth()">确认</button>`);
  document.getElementById('authInput').focus();
  window._authCallback = onSuccess;
}

function doAuth() {
  const val = document.getElementById('authInput').value;
  houseKey = val;
  api('/api/auth', { method:'POST', auth:true }).then(() => {
    if (window._authCallback) window._authCallback();
  }).catch(() => {
    showToast('密码错误', 'error');
    houseKey = '';
  });
}

/* ============ 花名册 ============ */
async function openRosterModal() {
  authStep('花名册管理', async () => {
    await loadPlayers();
    renderRosterModal();
  });
}

async function loadPlayers() {
  allPlayers = await api('/api/players');
}

function renderRosterModal() {
  const list = allPlayers.map(p => `
    <div class="roster-item">
      <div class="roster-avatar">${avatarImg(p.avatar_url, p.name)}</div>
      <input value="${escapeHtml(p.name)}" id="roster-${p.id}" onchange="updatePlayer(${p.id})">
      <button class="roster-del" onclick="deletePlayer(${p.id})" title="删除">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      </button>
    </div>
  `).join('');

  setModal('花名册管理', `
    ${list || '<div style="text-align:center;color:var(--paper-mute);padding:24px;font-family:var(--font-label);font-size:14px;">花名册为空，添加玩家开始</div>'}
    <div style="margin-top:20px;">
      <div class="form-group">
        <label class="form-label">添加新玩家</label>
        <div style="display:flex;gap:10px;">
          <input type="text" class="form-input" id="newPlayerName" placeholder="输入名字" onkeydown="if(event.key==='Enter')addPlayer()">
          <button class="btn btn-primary" onclick="addPlayer()">添加</button>
        </div>
      </div>
    </div>
  `, `<button class="btn btn-ghost" onclick="closeModal();loadStandings()">完成</button>`);
}

async function addPlayer() {
  const name = document.getElementById('newPlayerName').value.trim();
  if (!name) return;
  try {
    await api('/api/player', { method:'POST', auth:true, body:JSON.stringify({ name }) });
    document.getElementById('newPlayerName').value = '';
    await loadPlayers();
    renderRosterModal();
    showToast('已添加', 'success');
  } catch(e) { showToast(e.message, 'error'); }
}

async function updatePlayer(id) {
  const name = document.getElementById(`roster-${id}`).value.trim();
  if (!name) return;
  try {
    await api(`/api/player/${id}`, { method:'PUT', auth:true, body:JSON.stringify({ name }) });
    showToast('已更新', 'success');
  } catch(e) { showToast(e.message, 'error'); }
}

async function deletePlayer(id) {
  if (!confirm('确定删除？历史对局记录将保留。')) return;
  try {
    await api(`/api/player/${id}`, { method:'DELETE', auth:true });
    await loadPlayers();
    renderRosterModal();
    showToast('已删除', 'success');
  } catch(e) { showToast(e.message, 'error'); }
}

/* ============ 录入成绩 ============ */
async function openMatchModal() {
  if (!currentSeason || !currentSeason.is_active) {
    showToast('请先新建赛季', 'error');
    openModal('season');
    return;
  }
  authStep('录入成绩', async () => {
    await loadPlayers();
    if (allPlayers.length < 5) {
      setModal('录入成绩',
        '<div style="text-align:center;color:var(--paper-mute);padding:24px;font-family:var(--font-label);font-size:14px;">花名册不足 5 人，请先添加玩家</div>',
        '<button class="btn btn-ghost" onclick="closeModal()">关闭</button>');
      return;
    }
    renderMatchStep1();
  });
}

let matchSelected = new Set();

function renderMatchStep1() {
  matchSelected.clear();
  allPlayers.forEach(p => {
    if (matchSelected.size < 10) matchSelected.add(p.id);
  });

  const list = allPlayers.map(p => {
    const selected = matchSelected.has(p.id);
    return `
      <div class="player-pick ${selected ? 'selected' : ''}" id="pick-${p.id}" onclick="togglePick(${p.id})">
        <div class="pick-avatar">${avatarImg(p.avatar_url, p.name)}</div>
        <div class="check">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <label onclick="event.preventDefault();togglePick(${p.id})">${escapeHtml(p.name)}</label>
      </div>`;
  }).join('');

  const count = matchSelected.size;
  const countClass = (count < 5 || count > 10) ? 'warn' : 'ok';

  setModal('录入成绩 · 选人', `
    <div class="sort-hint">从花名册中勾选今天到场的 <b>5-10 人</b>，默认全选。</div>
    <div class="pick-actions">
      <button onclick="selectAllPlayers()">全选</button>
      <button onclick="clearAllPlayers()">清空</button>
    </div>
    <div class="player-pick-list">${list}</div>
    <div class="player-count ${countClass}" id="pickCount">已选 ${count} 人</div>
  `, `<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" id="step1Next" onclick="renderMatchStep2()" ${count < 5 || count > 10 ? 'disabled' : ''}>下一步</button>`);
}

function selectAllPlayers() {
  matchSelected.clear();
  allPlayers.forEach(p => {
    if (matchSelected.size < 10) matchSelected.add(p.id);
  });
  refreshPickUI();
}

function clearAllPlayers() {
  matchSelected.clear();
  refreshPickUI();
}

function refreshPickUI() {
  allPlayers.forEach(p => {
    const pick = document.getElementById(`pick-${p.id}`);
    if (!pick) return;
    const selected = matchSelected.has(p.id);
    pick.classList.toggle('selected', selected);
    pick.querySelector('.check svg').style.opacity = selected ? '1' : '0';
    pick.querySelector('.check svg').style.transform = selected ? 'scale(1)' : 'scale(0.3)';
  });
  const count = matchSelected.size;
  const el = document.getElementById('pickCount');
  el.textContent = `已选 ${count} 人`;
  el.className = 'player-count ' + (count < 5 || count > 10 ? 'warn' : 'ok');
  document.getElementById('step1Next').disabled = count < 5 || count > 10;
}

function togglePick(id) {
  const pick = document.getElementById(`pick-${id}`);
  if (matchSelected.has(id)) {
    matchSelected.delete(id);
    pick.classList.remove('selected');
    pick.querySelector('.check svg').style.opacity = '0';
    pick.querySelector('.check svg').style.transform = 'scale(0.3)';
  } else {
    if (matchSelected.size >= 10) { showToast('最多 10 人', 'error'); return; }
    matchSelected.add(id);
    pick.classList.add('selected');
    pick.querySelector('.check svg').style.opacity = '1';
    pick.querySelector('.check svg').style.transform = 'scale(1)';
  }
  const count = matchSelected.size;
  const el = document.getElementById('pickCount');
  el.textContent = `已选 ${count} 人`;
  el.className = 'player-count ' + (count < 5 || count > 10 ? 'warn' : 'ok');
  document.getElementById('step1Next').disabled = count < 5 || count > 10;
}

let matchOrder = [];

function renderMatchStep2() {
  matchOrder = Array.from(matchSelected).map(id => {
    const p = allPlayers.find(x => x.id === id);
    return { player_id: id, name: p.name, avatar_url: p.avatar_url, is_survivor: 0 };
  });
  renderSortList();
}

function renderSortList() {
  const total = matchOrder.length;
  const survivors = matchOrder.filter(r => r.is_survivor).length;
  const dead = total - survivors;
  const topScore = dead + 1;

  const deadList = matchOrder.filter(r => !r.is_survivor);
  matchOrder.forEach(r => {
    if (r.is_survivor) {
      r.score = topScore;
    } else {
      const idx = deadList.indexOf(r);
      r.score = dead - idx;
    }
  });

  const list = matchOrder.map((r, i) => `
    <div class="sort-item ${r.is_survivor ? 'survivor' : ''}" id="sort-${i}" draggable="true"
         ondragstart="dragStart(${i})" ondragover="event.preventDefault()" ondrop="dragDrop(${i})" ondragend="dragEnd()">
      <span class="sort-handle">⠿</span>
      <span class="sort-rank">${i + 1}</span>
      <div class="sort-avatar">${avatarImg(r.avatar_url, r.name)}</div>
      <span class="sort-name">${escapeHtml(r.name)}</span>
      <span class="sort-score">${r.score}</span>
      <button class="sort-toggle ${r.is_survivor ? 'active' : ''}" onclick="toggleSurvivor(${i})" title="存活/淘汰">${r.is_survivor ? '存' : '亡'}</button>
    </div>
  `).join('');

  const preview = matchOrder.map(r => `
    <span class="score-chip ${r.is_survivor ? 'survivor' : ''}">${escapeHtml(r.name)}<span class="val">${r.score}</span></span>
  `).join('');

  setModal('录入成绩 · 排序', `
    <div class="sort-hint">拖拽排列淘汰顺序（<b>上方 = 最后存活</b>，下方 = 先出局）。点击右侧按钮标记存活者。</div>
    <div class="sort-list">${list}</div>
    <div class="score-preview">
      <div class="score-preview-title">
        <span>分数预览</span>
        <span class="top-score">最高 ${topScore} 分</span>
      </div>
      <div class="score-preview-grid">${preview}</div>
    </div>
  `, `<button class="btn btn-ghost" onclick="renderMatchStep1()">上一步</button><button class="btn btn-primary" onclick="submitMatch()">提交</button>`);
}

let dragIndex = null;
function dragStart(i) {
  dragIndex = i;
  document.getElementById(`sort-${i}`).classList.add('dragging');
}
function dragEnd() {
  document.querySelectorAll('.sort-item').forEach(el => el.classList.remove('dragging'));
}
function dragDrop(targetIndex) {
  if (dragIndex === null || dragIndex === targetIndex) return;
  const [moved] = matchOrder.splice(dragIndex, 1);
  matchOrder.splice(targetIndex, 0, moved);
  dragIndex = null;
  renderSortList();
}

function toggleSurvivor(i) {
  matchOrder[i].is_survivor = matchOrder[i].is_survivor ? 0 : 1;
  renderSortList();
}

async function submitMatch() {
  const results = matchOrder.map((r, i) => ({
    player_id: r.player_id,
    rank: i + 1,
    is_survivor: r.is_survivor
  }));

  try {
    await api('/api/match', {
      method: 'POST', auth: true,
      body: JSON.stringify({ season_id: currentSeason.id, results })
    });
    closeModal();
    await loadStandings();
    showToast('成绩已录入', 'success');
  } catch(e) {
    showToast(e.message, 'error');
  }
}

/* ============ 赛季管理 ============ */
async function openSeasonModal() {
  authStep('赛季管理', async () => {
    await renderSeasonModal();
  });
}

async function renderSeasonModal() {
  const seasons = await api('/api/seasons');
  const list = seasons.map(s => `
    <div class="season-item ${s.is_active ? 'active' : ''}">
      <div>
        <div class="s-name">${escapeHtml(s.name)}</div>
        <div class="s-meta">${s.started_at ? s.started_at.slice(0,10) : ''} ${s.ended_at ? '→ '+s.ended_at.slice(0,10) : '· 进行中'}</div>
      </div>
      <div class="s-actions">
        <span class="s-matches">${s.match_count}局</span>
        ${s.is_active
          ? `<button class="s-btn" onclick="endSeason(${s.id})">结束</button>`
          : `<button class="s-btn gold" onclick="viewSeason(${s.id})">查看</button>`}
      </div>
    </div>
  `).join('');

  const defaultName = getDefaultSeasonName();

  setModal('赛季管理', `
    ${list || '<div style="text-align:center;color:var(--paper-mute);padding:24px;font-family:var(--font-label);font-size:14px;">暂无赛季</div>'}
    <div style="margin-top:20px;">
      <div class="form-group">
        <label class="form-label">新建赛季</label>
        <div style="display:flex;gap:10px;">
          <input type="text" class="form-input" id="newSeasonName" value="${defaultName}" onkeydown="if(event.key==='Enter')createSeason()">
          <button class="btn btn-primary" onclick="createSeason()">新建</button>
        </div>
      </div>
    </div>
  `, `<button class="btn btn-ghost" onclick="closeModal();loadStandings()">完成</button>`);

  document.getElementById('newSeasonName').focus();
  document.getElementById('newSeasonName').select();
}

async function createSeason() {
  const name = document.getElementById('newSeasonName').value.trim();
  if (!name) return;
  try {
    await api('/api/season', { method:'POST', auth:true, body:JSON.stringify({ name }) });
    await renderSeasonModal();
    showToast('赛季已创建', 'success');
  } catch(e) { showToast(e.message, 'error'); }
}

async function endSeason(id) {
  if (!confirm('确定结束当前赛季？结束后自动计算末位罚金并入账奖池。')) return;
  try {
    const result = await api(`/api/season/${id}/end`, { method:'POST', auth:true });
    await renderSeasonModal();
    showToast('赛季已结束', 'success');

    // 如果有罚金，展示结果
    if (result.fines && result.fines.length > 0) {
      const fineHtml = `
        <div class="fine-result">
          <div class="fine-result-title">本期罚金明细</div>
          ${result.fines.map(f => `
            <div class="fine-item">
              <div class="fine-avatar">${avatarImg(null, f.player_name)}</div>
              <span class="fine-name">${escapeHtml(f.player_name)}</span>
              <span class="fine-amount">${f.amount}元</span>
            </div>
          `).join('')}
          <div class="fine-result-total">
            奖池入账 <b>${result.fines.reduce((s,f) => s + f.amount, 0)}元</b> · 新余额 ${result.new_balance}元
          </div>
        </div>
      `;
      // 在弹窗 body 底部追加
      const body = document.getElementById('modalBody');
      body.insertAdjacentHTML('beforeend', fineHtml);
    }
  } catch(e) { showToast(e.message, 'error'); }
}

function viewSeason(id) {
  closeModal();
  loadStandings(id);
}

/* ============ 奖池 ============ */
async function openPrizeModal() {
  setModal('奖池', `<div style="text-align:center;color:var(--paper-mute);padding:40px;font-family:var(--font-label);font-size:14px;">加载中...</div>`, '');
  try {
    const data = await api('/api/prize-pool/summary');
    renderPrizeModal(data);
  } catch(e) {
    setModal('奖池', `<div style="text-align:center;color:var(--vermilion);padding:40px;font-family:var(--font-label);font-size:14px;">加载失败：${escapeHtml(e.message)}</div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">关闭</button>`);
  }
}

function renderPrizeModal(data) {
  const { current_balance, contributions, recent_transactions } = data;

  const contribHtml = contributions.length > 0
    ? `<div class="contribution-list">
        ${contributions.map((c, i) => `
          <div class="contribution-item">
            <span class="contrib-rank">${i + 1}</span>
            <div class="contrib-avatar">${avatarImg(c.avatar_url, c.name)}</div>
            <span class="contrib-name">${escapeHtml(c.name)}</span>
            <span class="contrib-amount">${c.total_amount}元</span>
          </div>
        `).join('')}
      </div>`
    : `<div class="prize-empty">暂无贡献记录</div>`;

  const txHtml = recent_transactions.length > 0
    ? `<div class="tx-list">
        ${recent_transactions.map(t => {
          const isPositive = t.amount > 0;
          const typeLabel = t.type === 'fine' ? '罚金入账' : '支取';
          const desc = t.type === 'fine'
            ? (t.season_name || '赛季罚金') + ' · ' + (t.player_name || '')
            : (t.description || '支取');
          return `
            <div class="tx-item">
              <div class="tx-info">
                <span class="tx-type ${t.type}">${typeLabel}</span>
                <div class="tx-desc">${escapeHtml(desc)}</div>
              </div>
              <div class="tx-amount">
                <span class="val ${isPositive ? 'positive' : 'negative'}">${isPositive ? '+' : ''}${t.amount}元</span>
                <span class="balance">余额 ${t.balance}元</span>
              </div>
            </div>
          `;
        }).join('')}
      </div>`
    : `<div class="prize-empty">暂无流水记录</div>`;

  setModal('奖池', `
    <div class="prize-total">
      <div class="label">公共基金池</div>
      <div class="amount">${current_balance}<span class="yuan">元</span></div>
    </div>

    <div class="prize-section">
      <div class="prize-section-title">
        <span>贡献榜</span>
        <span class="count">${contributions.length}人</span>
      </div>
      ${contribHtml}
    </div>

    <div class="prize-section">
      <div class="prize-section-title">
        <span>流水</span>
        <span class="count">最近${recent_transactions.length}条</span>
      </div>
      ${txHtml}
    </div>
  `, `
    <button class="btn btn-ghost" onclick="closeModal()">关闭</button>
    <button class="btn btn-gold" onclick="openWithdraw()">支取</button>
  `);
}

function openWithdraw() {
  if (!houseKey) {
    authStep('支取奖池', () => showWithdrawForm());
    return;
  }
  showWithdrawForm();
}

async function showWithdrawForm() {
  // 重新获取余额以显示
  try {
    const data = await api('/api/prize-pool/summary');
    setModal('支取奖池', `
      <div class="withdraw-hint">
        当前奖池余额：<b>${data.current_balance} 元</b>
      </div>
      <div class="form-group">
        <label class="form-label">支取金额（元）</label>
        <input type="number" class="form-input" id="withdrawAmount" placeholder="输入金额" min="0.01" step="0.01">
      </div>
      <div class="form-group">
        <label class="form-label">用途说明</label>
        <input type="text" class="form-input" id="withdrawDesc" placeholder="如：聚餐、采购等">
      </div>
    `, `
      <button class="btn btn-ghost" onclick="openPrizeModal()">返回</button>
      <button class="btn btn-primary" onclick="submitWithdraw()">确认支取</button>
    `);
  } catch(e) {
    showToast(e.message, 'error');
  }
}

async function submitWithdraw() {
  const amount = parseFloat(document.getElementById('withdrawAmount').value);
  const description = document.getElementById('withdrawDesc').value.trim();

  if (!amount || amount <= 0) {
    showToast('请输入有效金额', 'error');
    return;
  }

  try {
    await api('/api/prize-pool/withdraw', {
      method: 'POST',
      auth: true,
      body: JSON.stringify({ amount, description })
    });
    showToast('支取成功', 'success');
    await openPrizeModal();
  } catch(e) {
    showToast(e.message, 'error');
  }
}

init();

async function init() {
  await loadStandings();
}
</script>
